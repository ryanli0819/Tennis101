}

/* THE BALL: round, optic yellow felt, lit from the light side and shaded on the other, a white seam that turns
   with its spin, a fuzzy edge, and a faint trail when it flies fast. (Its shadow is drawn by drawShadows.) */
const BALL_R = 0.1;                                      // drawn radius in metres: ~3× real, so it reads at any distance
function drawBall(ball) {
  const p = proj(ball.x, ball.y, ball.z), r = Math.min(9, Math.max(2.2, BALL_R * p.s)), cx = q(p.x), cy = q(p.y);
  const tr = ball._trail || (ball._trail = []);
  const sp = tr.length ? Math.hypot(ball.x - tr[0].x, ball.y - tr[0].y, ball.z - tr[0].z) : 0;
  if (sp > 0.12 && !matchMedia("(prefers-reduced-motion: reduce)").matches)      // moving fast: a short fading trail
    tr.slice(0, 3).forEach((o, k) => { const t = proj(o.x, o.y, o.z);
      b.fillStyle = `rgba(216,238,76,${0.22 - k * 0.06})`; b.beginPath(); b.arc(q(t.x), q(t.y), r * (0.9 - k * 0.15), 0, Math.PI * 2); b.fill(); });
  tr.unshift({ x: ball.x, y: ball.y, z: ball.z }); tr.length = Math.min(tr.length, 4);
  const lx = litLeft() ? -1 : 1, night = !LIGHT().sun;
  b.save(); b.beginPath(); b.arc(cx, cy, r, 0, Math.PI * 2); b.clip();
  b.fillStyle = "#a9c02c"; b.fillRect(cx - r, cy - r, r * 2, r * 2);                         // shaded side
  b.fillStyle = "#d6ec3e"; b.beginPath(); b.arc(cx + lx * r * 0.28, cy - r * 0.24, r * 0.95, 0, Math.PI * 2); b.fill();   // lit felt
  b.fillStyle = "#f2fb9a"; b.beginPath(); b.arc(cx + lx * r * 0.42, cy - r * 0.42, r * (night ? 0.24 : 0.32), 0, Math.PI * 2); b.fill();   // highlight
  const th = (clock || gameT) * 11 + ball.x;                                               // the seam turns with the spin
  b.strokeStyle = "rgba(250,250,238,0.95)"; b.lineWidth = Math.max(1 / AS, r * 0.16);
  b.beginPath(); b.ellipse(cx - Math.cos(th) * r * 0.55, cy - Math.sin(th) * r * 0.55, r * 0.75, r * 0.5, th, -1.1, 1.1); b.stroke();
  b.beginPath(); b.ellipse(cx + Math.cos(th) * r * 0.55, cy + Math.sin(th) * r * 0.55, r * 0.75, r * 0.5, th + Math.PI, -1.1, 1.1); b.stroke();
  b.restore();
  b.fillStyle = "rgba(226,244,120,0.55)";                                                  // felt fuzz around the edge
  for (let k = 0; k < 10; k++) { const a = k * 0.628 + th * 0.2; b.fillRect(q(cx + Math.cos(a) * r) - 0.5 / AS, q(cy + Math.sin(a) * r) - 0.5 / AS, 1 / AS, 1 / AS); }
}

/* =====================================================================
   FOOTWORK — player-controlled bodies (same physics for both players)
   ===================================================================== */
const newBody = (y) => ({ x: 0, y, vx: 0, vy: 0, run: 0, moving: false,
  stam: 100, cap: 100, stamAtStart: 100,      // stamina now / ceiling it can recover to / at point start
  air: 0, boost: 0, boostMul: 1,              // split-step: time left in the air, first-step boost after landing
  landT: -9, contactT: -9, contactId: 0, gradedFor: -1,
  slide: 0, slideV: { x: 0, y: 0 }, slideCD: 0, slideRec: 0 });   // slide: time left, its velocity, cooldown, recovery
const pos = [newBody(-12.4), newBody(12.4)];
let ball = null;          // {x,y,z}
let rally = null;
let swing = [0, 0];
let clock = 0;            // rally time in seconds
const SPLIT_AIR = 0.22;   // seconds a split-step hop keeps you off the ground
const input = { keys: new Set(), stick: { x: 0, y: 0 }, slice: false };   // slice: the touch Slice button is armed
const ai = { target: null, at: 0 };

/* One physics step for a body. ix/iy is the wanted direction (-1..1) in court axes. */
function moveBody(i, ix, iy, dt) {
  const p = pos[i], B = BODY[i];
  if (!Number.isFinite(p.stam)) p.stam = p.cap || 100;   // safety: a broken stamina value must never freeze the player
  const tire = 0.62 + 0.38 * p.stam / 100;          // tired legs: slower and less explosive
  const m = Math.hypot(ix, iy); if (m > 1) { ix /= m; iy /= m; }
  let used = 0;
  p.slideCD = Math.max(0, p.slideCD - dt); p.slideRec = Math.max(0, p.slideRec - dt); p.plant = Math.max(0, (p.plant || 0) - dt);
  if (p.slide > 0) {                                  // sliding: the body glides and slows down; no new push-off
    p.slide = Math.max(0, p.slide - dt);
    const k = p.slide / SLIDE.dur;                    // speed falls linearly to zero over the slide
    p.vx = p.slideV.x * k; p.vy = p.slideV.y * k;
    if (p.slide === 0) p.slideRec = SLIDE.recover;    // you have to plant and recover after a slide
  } else if (p.air > 0) {                             // airborne: no push-off, momentum carries you
    p.air -= dt;
    if (p.air <= 0) { p.landT = clock; gradeSplit(i); }
  } else {
    const dx = ix * B.top * tire - p.vx, dy = iy * B.top * tire - p.vy, dl = Math.hypot(dx, dy);
    if (dl > 1e-4) {
      const braking = dx * p.vx + dy * p.vy < 0;      // fighting your own momentum
      if (braking && Math.hypot(p.vx, p.vy) > 2.4 && dl > B.top * 0.9) p.plant = 0.16;   // a hard change of direction: plant (animation)
      const rate = (braking ? B.brake : B.accel * (p.boost > 0 ? p.boostMul : 1)) * tire * (p.slideRec > 0 ? 0.4 : 1);
      const dv = Math.min(dl, rate * dt);
      p.vx += dx / dl * dv; p.vy += dy / dl * dv;
      used = dv / dt;
    }
  }
  p.boost = Math.max(0, p.boost - dt);
  p.x += p.vx * dt; p.y += p.vy * dt;
  // stay in your own half, inside the stadium
  const s = sideSign(i), yMin = s < 0 ? -16 : 0.8, yMax = s < 0 ? -0.8 : 16;
  if (p.x < -8 || p.x > 8) { p.x = Math.max(-8, Math.min(8, p.x)); p.vx = 0; }
  if (p.y < yMin || p.y > yMax) { p.y = Math.max(yMin, Math.min(yMax, p.y)); p.vy = 0; }
  const sp = Math.hypot(p.vx, p.vy);
  p.moving = sp > 0.4; p.run += dt * (0.4 + sp / 3);
  // stamina: running fast costs, changing speed costs more
  p.stam = Math.max(0, p.stam - dt * B.drain * (0.9 * (sp / B.top) ** 2 + 1.6 * used / B.accel));
}

/* Slide: a burst that carries you a set distance in the direction you're pushing (or already running).
   Clay lets you slide furthest, grass least; Agility adds a little. Costs stamina, then a short
   recovery (slower first step) and a cooldown before the next one. */
const SLIDE = { dur: 0.32, recover: 0.25, cooldown: 0.8, stamina: 3,
                dist: { clay: 2.4, hard: 1.6, grass: 1.3 } };   // metres
function slide(i) {
  const p = pos[i], B = BODY[i];
  if (!rally || rally.serve || p.slide > 0 || p.slideCD > 0 || p.air > 0) return;
  let [dx, dy] = i === 0 ? userInput() : [0, 0];
  if (!dx && !dy) { dx = p.vx; dy = p.vy; }           // no key held: slide the way you're running
  const m = Math.hypot(dx, dy); if (m < 0.1) return;
  const dist = (SLIDE.dist[cfg.surface] || 1.6) * (1 + 0.03 * ((getSkills(PLAYERS[i].id).agility || 10) - 10));
  const v0 = 2 * dist / SLIDE.dur;                    // linear slow-down: distance = v0 × dur / 2
  p.slideV = { x: dx / m * v0, y: dy / m * v0 };
  p.slide = SLIDE.dur; p.slideCD = SLIDE.cooldown;
  p.stam = Math.max(0, p.stam - SLIDE.stamina * B.drain);
  say(i, "SLIDE");
}

/* Split-step: a small hop timed to land as the opponent strikes the ball. */
function splitStep(i) {
  const p = pos[i];
  if (!rally || p.air > 0) return;
  p.air = SPLIT_AIR;
}
function gradeSplit(i) {
  const p = pos[i];
  if (p.gradedFor === p.contactId || p.air > 0) return;
  const d = p.landT - p.contactT;                     // + = landed after the opponent's contact
  if (Math.abs(d) > 0.3) return;                      // hop unrelated to this shot
  p.gradedFor = p.contactId;
  const a = Math.abs(d);
  if (a <= BODY[i].splitPerfect) { p.boost = 0.5; p.boostMul = 1.8; say(i, "PERFECT SPLIT"); }   // windows widen with Reflexes
  else if (a <= BODY[i].splitGood) { p.boost = 0.4; p.boostMul = 1.45; say(i, "GOOD SPLIT"); }
  else say(i, d < 0 ? "EARLY SPLIT" : "LATE SPLIT");
}

/* Opponent AI drives the same body: steer to a target, brake in time to stop on it. */
function aiInput() {
  const p = pos[1], t = ai.target;
  if (!t) return [0, 0];
  const dx = t.x - p.x, dy = t.y - p.y, d = Math.hypot(dx, dy);
  const v = Math.hypot(p.vx, p.vy);
  if (d < 0.15 || d <= v * v / (2 * BODY[1].brake) + 0.1) return [0, 0];
  return [dx / d, dy / d];
}
/* MOVEMENT is always WASD: W = forward (toward the net), S = back, A = left, D = right (or drag on touch).
   How fast you then move comes from moveBody(): body + Speed skill, not from the key. */
function userInput() {
  const k = input.keys;
  let x = (k.has("d") ? 1 : 0) - (k.has("a") ? 1 : 0);
  let y = (k.has("w") ? 1 : 0) - (k.has("s") ? 1 : 0);
  if (!x && !y) { x = input.stick.x; y = input.stick.y; }
  return [x, y];
}
/* AIMING your serve is separate: arrow keys (← → sideways, ↑ ↓ deeper / shorter), or click / tap the box. */
function aimInput() {
  const k = input.keys;
  return [(k.has("ArrowRight") ? 1 : 0) - (k.has("ArrowLeft") ? 1 : 0), (k.has("ArrowUp") ? 1 : 0) - (k.has("ArrowDown") ? 1 : 0)];
}

let msgTimer;
function say(i, text) {
  if (i !== 0) return;                                // only the user's body talks to the HUD
  const el = document.getElementById("hudMsg");
  el.textContent = text;
  clearTimeout(msgTimer); msgTimer = setTimeout(() => (el.textContent = ""), 1100);
}

/* =====================================================================
   CAPTURED SERVE — Sinner serves with his real motion (src/serve/motion/sinner-serve.js)
   The file holds his joints frame by frame in body heights, taken from video and cleaned.
   ===================================================================== */
const SINNER_SERVES = window.SERVE_MOTIONS?.sinner || null;               // { first, second } from his real serves
const capturedServe = () => !!SINNER_SERVES?.first && PLAYERS[0].id === "sinner";   // only Sinner's serves are captured so far
const motionFor = no => (no === 2 && SINNER_SERVES.second) || SINNER_SERVES.first;  // 2nd serve (after a fault) has its own motion
const RACKET_M = 0.68;                                   // racket length

/* Pose at time t: a Catmull-Rom curve through the captured frames around t (smooth, no corners between frames).
   Returns { joint: [x, up] } in body heights. */
function motionPose(m, t) {
  const fr = m.frames;
  let k = 1;
  while (k < fr.length - 1 && fr[k].t < t) k++;
  const a = fr[k - 1], c = fr[k], a0 = fr[Math.max(0, k - 2)], c1 = fr[Math.min(fr.length - 1, k + 1)];
  const u = Math.max(0, Math.min(1, (t - a.t) / ((c.t - a.t) || 1)));
  const cr = (p0, p1, p2, p3) => 0.5 * (2 * p1 + (p2 - p0) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u * u + (3 * p1 - p0 - 3 * p2 + p3) * u * u * u);
  const out = {};
  for (const n in c.j) {
    const p1 = a.j[n] || c.j[n], p2 = c.j[n], p0 = a0.j[n] || p1, p3 = c1.j[n] || p2;
    out[n] = [cr(p0[0], p1[0], p2[0], p3[0]), cr(p0[1], p1[1], p2[1], p3[1])];
  }
  return out;
}
/* Body heights → court metres for a player standing at p (scaled by their real height). */
function poseToWorld(i, p, pose) {
  const h = PLAYERS[i].heightM, right = PLAYERS[i].side === "near" ? 1 : -1, w = {};
  for (const n in pose) w[n] = { x: p.x + pose[n][0] * h * right, y: p.y, z: Math.max(0, pose[n][1] * h) };
  return w;
}
/* Advance Sinner's captured motion. During the serve the ball rides in his tossing hand, is tossed
   on one real throw that meets the racket at the captured contact moment, and is then struck. */
function stepMotion(dt) {
  const mo = pos[0].motion, m = mo.m, E = m.events;
  mo.t += dt;
  const W = mo.world = poseToWorld(0, pos[0], motionPose(m, mo.t));
  const sv = rally && rally.serve;
  if (sv) {
    if (mo.t < E.start) {                                // ROUTINE: he bounces the ball ROUTINE.bounces times
      const P = (E.start - mo.t0) / ROUTINE.bounces, f = ((mo.t - mo.t0) / P) % 1, h = W.leftWrist;
      Object.assign(ball, { x: h.x, y: h.y + 0.25, z: h.z * (2 * f - 1) ** 2 });   // hand → ground → hand
    } else if (mo.t < E.tossRelease) {
      Object.assign(ball, W.leftWrist);                  // ball in the tossing hand
    } else {
      if (!sv.release) {                                 // solve the toss once: release point → contact point
        const C = poseToWorld(0, pos[0], motionPose(m, E.contact));
        const T = E.contact - E.tossRelease;
        sv.release = { ...W.leftWrist };
        sv.hit = { x: C.rightWrist.x, z: C.rightWrist.z + RACKET_M * 0.9 };
        sv.vz = (sv.hit.z - sv.release.z + 0.5 * 9.81 * T * T) / T;   // z(T) = hit height under gravity
      }
      const tt = mo.t - E.tossRelease, u = Math.min(1, tt / (E.contact - E.tossRelease));
      ball.x = sv.release.x + (sv.hit.x - sv.release.x) * u;
      ball.y = pos[0].y + 0.45 * u;                      // the toss drifts a little into the court
      ball.z = sv.release.z + sv.vz * tt - 0.5 * 9.81 * tt * tt;
      if (mo.t >= E.contact) { rally.serve = null; hitBall(0, true); }   // contact: the serve leaves the racket
    }
  }
  if (mo.t >= E.finish) pos[0].motion = null;           // landing done: back to the normal sprite
}

/* =====================================================================
   SERVING — the rhythm between points, aiming, faults, lets and aces
   The game serves by itself: ~4 s after a point (BETWEEN_POINTS), with a READY countdown at the end.
   During READY the server aims (A/D sideways, W/S depth) and the receiver moves into position.
   ===================================================================== */
/* Rhythm: point ends → 0.9 s → players reset → GET SET (POSITION s: move with WASD, aim) → the serve sequence:
   ball bounces (routine), toss and windup, contact. Contact lands ~4 s after the previous point ended. */
const BETWEEN_POINTS = 2.0, POSITION = 1.1, BETWEEN_SERVES = 1.6;   // seconds until the serve sequence starts
const READY = POSITION;                                              // (old name, still used by the start of a match)
const ROUTINE = { bounces: 2, seconds: 1.3, toss: 0.8 };             // serve routine when no captured motion exists
let firstPersonServe = false;                                        // V toggles: watch your windup, or serve through your own eyes
let gameT = 0, paused = false;                          // game clock (stops while paused)
const timers = [];
function after(sec, fn) { timers.push({ at: gameT + sec, fn }); }
function runTimers() {
  for (let k = timers.length - 1; k >= 0; k--) if (timers[k].at <= gameT) timers.splice(k, 1)[0].fn();
}
let nextServe = null;                                    // { at, no, ready } — the serve that's coming up
function queueServe(delay, no = 1) { nextServe = { at: gameT + delay, no, ready: false }; }
function cancelServe() { nextServe = null; timers.length = 0; }
const clamp = (v, a, c) => Math.max(Math.min(a, c), Math.min(Math.max(a, c), v));
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) * 1.41;   // ≈ normal, sd 1

/* The service box the server must hit: cross-court from where they stand. */
function serviceBox(server) {
  const sy = sideSign(1 - server), side = Math.sign(pos[server].x) || 1;
  const wide = -side * COURT.SGL;                        // the singles sideline of that box
  return { xlo: Math.min(wide, 0), xhi: Math.max(wide, 0), ylo: Math.min(0, sy * COURT.SVC), yhi: Math.max(0, sy * COURT.SVC),
           wide, t: 0, back: sy * COURT.SVC, sy, mid: wide / 2 };
}
/* Your aim, while you serve. Starts in the middle of the box; A/D move it sideways, W/S deeper or shorter. */
const aim = { x: 0, y: 0 };
function resetAim() { const bx = serviceBox(0); aim.x = bx.mid; aim.y = bx.back * 0.8; }
function steerAim(dt) {
  const [x, y] = aimInput(), bx = serviceBox(0);
  aim.x = clamp(aim.x + x * 3.2 * dt, bx.xlo + 0.05, bx.xhi - 0.05);
  aim.y = clamp(aim.y + y * 2.4 * dt * bx.sy, bx.sy * 1.5, bx.sy * (COURT.SVC - 0.05));
}
/* The computer server picks wide, body or down the T; second serves stay safer. */
function aiAim(bx, second) {
  const r = Math.random(), safe = second ? 0.55 : 0.85;
  const x = r < 0.4 ? bx.wide * safe : r < 0.7 ? bx.mid : bx.wide * (1 - safe) + 0.001;
  return { x, y: bx.back * (second ? 0.72 : 0.86) };
}
/* ACE_CHANCE holds the probability that the last serve was an ace, and why. An ace needs a near-perfect
   placement (within 45 cm of the T, the sideline or the service line); it's far likelier when the
   receiver is on the wrong side. Serve skill adds a constant step per point; second serves rarely ace. */
let ACE_CHANCE = { chance: 0, perfect: false, wrongSide: false };
function planServe(server, no) {
  const B = BODY[server], bx = serviceBox(server), second = no === 2, r = pos[1 - server];
  const target = server === 0 ? { ...aim } : aiAim(bx, second);
  const sd = (second ? 0.65 : 1.35) * B.errMul;           // Control tightens the spread; a 2nd serve plays safe (tuned: ~35% 1st-serve faults, few double faults)
  const land = { x: target.x + gauss() * sd, y: target.y + gauss() * sd * 0.8 };
  const net = Math.random() < (second ? 0.04 : 0.09) * B.errMul;
  const inBox = land.x >= bx.xlo && land.x <= bx.xhi && land.y >= bx.ylo && land.y <= bx.yhi;
  const fault = net || !inBox;
  const isLet = !fault && Math.random() < (PLAYERS[server].letRate || 0.02);
  const edge = Math.min(Math.abs(land.x - bx.wide), Math.abs(land.x - bx.t), Math.abs(land.y - bx.back));
  const perfect = !fault && edge < 0.45;
  const wrongSide = Math.sign(land.x - bx.mid) !== Math.sign(r.x - bx.mid) && Math.abs(land.x - r.x) > 1.4;
  const skill = (getSkills(PLAYERS[server].id).serve || 10) - 10;
  let chance = perfect ? (wrongSide ? 0.22 + 0.012 * skill : 0.04 + 0.004 * skill) : 0;   // never extreme: the receiver still gets a racket on most
  if (second) chance *= 0.3;
  chance = clamp(chance, 0, 0.4);
  ACE_CHANCE = window.ACE_CHANCE = { server, no, chance: +chance.toFixed(3), perfect, wrongSide, land, target };
  return { no, land, target, fault, net, let: isLet, ace: !isLet && Math.random() < chance };
}
/* The READY time before a serve: the server aims, the receiver gets into position. */
function readyStep(dt) {
  if (!nextServe || rally || S.over) return;
  const left = nextServe.at - gameT;
  if (left <= POSITION && !nextServe.ready) {            // GET SET starts: set up once
    nextServe.ready = true;
    if (S.server === 0) {
      resetAim();
      const bx = serviceBox(0);                          // the computer receiver stands mid-box, leaning a little one way
      ai.target = { x: bx.mid + (Math.random() < 0.5 ? -1 : 1) * Math.abs(bx.wide) * 0.25, y: sideSign(1) * 12.4 };
    }
  }
  if (nextServe.ready) {
    const u = userInput(); moveBody(0, u[0], u[1], dt);  // WASD: you walk to your spot (serving or receiving)
    if (S.server === 0) { keepServeStance(0); steerAim(dt); const a = aiInput(); moveBody(1, a[0], a[1], dt); }
  }
  if (left <= 0) { const no = nextServe.no; nextServe = null; startRally(no); }
}
/* A server must stand behind the baseline, between the centre mark and the singles sideline, on the correct side. */
function keepServeStance(i) {
  const p = pos[i], side = Math.sign(startPositions()[i].x) || 1, s = sideSign(i);
  p.x = side > 0 ? clamp(p.x, 0.2, COURT.SGL) : clamp(p.x, -COURT.SGL, -0.2);
  p.y = s < 0 ? clamp(p.y, -14, -COURT.L - 0.05) : clamp(p.y, COURT.L + 0.05, 14);
}

/* Serve routine for players without a captured motion: bounce the ball, toss it, hit it at the top of their reach. */
function stepRoutineServe(dt) {
  const sv = rally.serve, i = S.server, p = pos[i], P = PLAYERS[i], near = P.side === "near";
  sv.t += dt;
  const hand = { x: p.x + (near ? -0.3 : 0.3), y: p.y + (near ? 0.25 : -0.25), z: 1.0 };
  if (sv.t < ROUTINE.seconds) {
    const f = (sv.t / (ROUTINE.seconds / ROUTINE.bounces)) % 1;
    Object.assign(ball, { x: hand.x, y: hand.y, z: hand.z * (2 * f - 1) ** 2 });
    return;
  }
  const tt = sv.t - ROUTINE.seconds, T = ROUTINE.toss, hitZ = P.heightM * 1.22 + 0.6;   // toss → contact at the top of the reach
  const vz = (hitZ - hand.z + 4.905 * T * T) / T;
  Object.assign(ball, { x: hand.x + (p.x + (near ? 0.25 : -0.25) - hand.x) * Math.min(1, tt / T), y: hand.y, z: hand.z + vz * tt - 4.905 * tt * tt });
  swing[i] = Math.max(swing[i], tt > T * 0.7 ? 0.6 : 0);
  if (tt >= T) { rally.serve = null; hitBall(i, true); }
}

/* =====================================================================
   POINT FLOW — serve, contact, out / unreturned
   ===================================================================== */

const sideSign = i => (PLAYERS[i].side === "near" ? -1 : 1);   // which half a player lives in
function startPositions() {
  const pts = S.points[0] + S.points[1];
  const deuce = pts % 2 === 0;
  const s = S.server, r = 1 - s;
  // deuce court = server's right. Near player's right is +x, far player's right is -x.
  const right = i => (PLAYERS[i].side === "near" ? 1 : -1);
  const sx = (deuce ? 1 : -1) * right(s) * 0.9;
  return {
    [s]: { x: sx, y: sideSign(s) * 12.2 },
    [r]: { x: -sx * 3.0, y: sideSign(r) * 12.6 }
  };
}
function resetPositions() {
  const sp = startPositions();
  [0, 1].forEach(i => Object.assign(pos[i], sp[i], { vx: 0, vy: 0, air: 0, boost: 0, moving: false, motion: null }));
  ball = { x: pos[S.server].x + 0.35, y: pos[S.server].y, z: 1.0 };
}
function resetBodies() {
  pos.forEach(p => Object.assign(p, { stam: 100, cap: 100, stamAtStart: 100 }));
}

const rand = (a, c) => a + Math.random() * (c - a);
/* q (0..1) = how well-set the hitter was: better footwork → faster, wider ball. out = the shot misses. */
function planShot(hitter, isServe, q, out, sv = null, type = "drive") {
  const slice = !isServe && type === "slice";            // SLICE / drop shot: short, low, dies after the bounce
  const recv = 1 - hitter, sign = sideSign(recv);
  // every serve now starts where the racket met the toss (captured or routine); rally shots where the ball was hit
  const from = { x: ball.x, y: ball.y, z: isServe ? Math.max(2.4, ball.z) : Math.max(0.6, ball.z) };
  let bx, by;
  if (isServe) {
    bx = sv.land.x; by = sv.land.y;                     // where the serve lands (planServe)
    if (sv.net) by = sideSign(hitter) * 0.3;            // into the net: drops on the server's side
  }
  else {
    const away = -Math.sign(pos[recv].x || (Math.random() - 0.5));   // aim away from where the opponent stands
    bx = (Math.random() < 0.6 ? away : -away) * rand(0.3, 2.6 + 1.3 * q + BODY[hitter].aimBonus);   // Control: sharper angles
    by = slice ? sign * rand(2.0, 4.8) : sign * rand(6.5, 10.8);   // a slice lands short, near the service line or closer
  }
  if (out && !isServe) {
    if (Math.random() < 0.5) by = sign * rand(12.2, 13.4);
    else bx = Math.sign(bx || 1) * rand(4.25, 5.0);
  }
  const cy = slice ? by + sign * rand(1.2, 2.6)          // a slice barely carries after the bounce: the receiver must come forward
                   : sign * rand(11.6, 13.0);           // ideal contact depth after the bounce
  const k = (cy - from.y) / (by - from.y);
  const cx = Math.max(-6.5, Math.min(6.5, from.x + (bx - from.x) * k));
  const dist = Math.hypot(bx - from.x, by - from.y);
  // Strength / Serve skills add a constant m/s per point (shared with the Ball Physicist)
  const speed = isServe ? (sv.no === 2 ? 32 : 40) + BODY[hitter].serveBonus
              : slice ? 10.5 + 2.5 * q + rand(0, 1.5) + BODY[hitter].shotBonus * 0.3   // a slice is clearly slower than a drive: it floats
              : 19 + 6 * q + rand(0, 3) + BODY[hitter].shotBonus;               // 2nd serves are slower, safer
  /* CURVE. arc = how much the ball rises above a straight line (net clearance); curve = sideways bend in flight.
     1st serve: flat-slice — low over the net, bending toward the sideline it's aimed at, skidding low.
     2nd serve: kick — a high, safe arc over the net, bending the other way and jumping up after the bounce.
     Rally shots: topspin — a higher arc and a little sideways drift. */
  const toWide = Math.sign(bx - from.x) || 1;
  const arc = isServe ? (sv.no === 2 ? 2.7 : 1.25) : slice ? 2.4 : 6;   // slice: low over the net (backspin)
  const curve = isServe ? (sv.no === 2 ? -toWide * rand(0.2, 0.35) : toWide * rand(0.35, 0.6)) : slice ? toWide * rand(0.2, 0.45) : rand(-0.35, 0.35);
  const kick = isServe ? (sv.no === 2 ? { up: 1.45, side: -toWide * 0.45 } : { up: 0.8, side: toWide * 0.25 })
             : slice ? { up: 0.4, side: 0 } : { up: 1, side: 0 };   // backspin: the slice stays low and stops
  return { hitter, recv, from, bounce: { x: bx, y: by }, end: { x: cx, y: cy, z: slice ? 0.45 : 1.0 }, isServe, serve: sv, arc, curve, kick, type,
           t1: dist / speed, t2: (0.42 - 0.08 * q) / SURF().pace * (slice ? 1.5 : 1), t: 0, out, bounced: false, prevD: Infinity, prevV: Infinity };
}

/* Player i strikes the ball. Placeholder hitting (step 4 adds timing + contact point). */
function hitBall(i, isServe, volley = false) {
  const p = pos[i], B = BODY[i];
  let q = 1, err = 0;
  if (!isServe) {
    const reach = B.reach * (volley ? B.volleyReach : 1);
    const sp = Math.hypot(p.vx, p.vy), stretch = Math.hypot(ball.x - p.x, ball.y - p.y) / reach;
    q = Math.max(0, 1 - Math.max(0, sp / B.top - 0.25) * 1.3) * (stretch > 0.8 ? 0.5 : 1);   // feet set + ball in the zone
    err = (0.04 + (1 - q) * 0.22 + (1 - p.stam / 100) * 0.12) * B.errMul * (volley ? B.volleyErrMul : 1);
    if (volley) say(i, "VOLLEY");
  }
  // SHOT TYPE: you slice by holding E (or the Slice button) as you hit; the computer slices now and then,
  // more when it's stretched. A slice is a touch shot: a bit riskier.
  const type = isServe ? "drive" : (i === 0 ? (input.keys.has("e") || input.slice) : p.planSlice || (q < 0.6 && Math.random() < 0.12)) ? "slice" : "drive";
  p.planSlice = false;
  if (type === "slice") { err *= 1.25; if (i === 0) say(0, "SLICE"); }
  if (i === 0 && input.slice) { input.slice = false; sliceBtn.setAttribute("aria-pressed", "false"); sliceBtn.classList.remove("primary"); }
  swing[i] = 1;
  const Rs = PLAYERS[i].side === "near" ? 1 : -1;
  Object.assign(p, { hitT: clock, hitServe: isServe, strokeType: type, hitZ: ball.z, strokeSide: Math.sign((ball.x - p.x) * Rs) || 1 });   // racket follow-through
  if (isServe) {
    const sv = planServe(i, rally.serveNo);
    rally.shot = planShot(i, true, 1, sv.fault, sv);
    rally.serveClock = clock;
    if (i === 0 && ACE_CHANCE.chance > 0) say(0, `${ACE_CHANCE.perfect ? "PERFECT SPOT · " : ""}ACE CHANCE ${Math.round(ACE_CHANCE.chance * 100)}%`);
  } else rally.shot = planShot(i, isServe, q, Math.random() < err, null, type);
  const o = 1 - i, op = pos[o];
  op.contactT = clock; op.contactId++;
  if (o === 1) op.planSlice = !isServe && Math.random() < 0.15;    // the computer picks a slice early, so you can read its windup
  gradeSplit(o);
  if (o === 0) {
    if (Math.abs(op.vx) > 1.6 && op.vx * (rally.shot.end.x - op.x) < 0) say(0, "WRONG-FOOTED");
    ai.target = { x: 0, y: 12.2 }; ai.at = 0;         // AI recovers to the middle
  } else {
    const read = isServe ? rand(0.05, 0.12) : rand(0.12, 0.26);    // a returner reads the toss, so reacts sooner to a serve
    ai.target = null; ai.at = clock + Math.max(0.04, read - BODY[o].reactionCut);   // AI reaction time (Reflexes)
    if (Math.random() < 0.6) { op.boost = 0.45; op.boostMul = 1.5; }   // AI's own split-step
  }
}

function startRally(no = 1) {                            // no = 1st or 2nd serve
  if (S.over || rally) return;
  const sp = pos[S.server];
  Object.assign(sp, { vx: 0, vy: 0, slide: 0 });
  ball = { x: sp.x + 0.35, y: sp.y, z: 1.0 };
  if (no === 1) pos.forEach(p => (p.stamAtStart = p.stam));
  clock = 0;
  rally = { shot: null, games: gamesPlayed(), sets: S.sets.length, serveNo: no, serve: { t: 0 } };   // every serve: routine → windup → contact
  if (S.server === 0 && capturedServe()) {                 // Sinner serves with his real, captured motion (1st or 2nd)
    const m = motionFor(no);
    // the 1st-serve clip includes his real routine; the 2nd doesn't, so he holds his stance while the ball bounces
    const t0 = m.events.routine != null ? m.events.routine : m.events.start - ROUTINE.seconds;
    rally.serve.captured = true;
    pos[0].motion = { t: t0, m, t0 };
  }
  bug.classList.add("live");                     // scoreboard fades while the point is live
  renderScore();
}

function stepRally(dt) {
  if (pos[0].motion) stepMotion(dt);
  if (!rally) return;
  if (rally.serve) {                                    // routine and windup: the server's feet are planted
    if (S.server === 0) steerAim(dt);                    // you can aim until contact
    else { const u = userInput(); moveBody(0, u[0], u[1], dt); }   // receiving: you can still move
    if (rally.serve && !rally.serve.captured) stepRoutineServe(dt);
    return;
  }
  const sh = rally.shot; if (!sh) return;               // (guard: a point always has a ball in flight here)
  sh.t += dt;
  if (ai.at && clock >= ai.at) { ai.target = { x: sh.end.x, y: sh.end.y }; ai.at = 0; }
  const ui = userInput(), ain = aiInput();
  moveBody(0, ui[0], ui[1], dt);
  moveBody(1, ain[0], ain[1], dt);
  swing = swing.map(v => Math.max(0, v - dt * 4));

  if (sh.t < sh.t1) {
    const u = sh.t / sh.t1;
    ball.x = sh.from.x + (sh.bounce.x - sh.from.x) * u + sh.curve * Math.sin(Math.PI * u);   // bends in flight, lands on target
    ball.y = sh.from.y + (sh.bounce.y - sh.from.y) * u;
    ball.z = sh.from.z * (1 - u) + sh.arc * u * (1 - u);
    // VOLLEY: once the ball has crossed the net, the receiver may take it out of the air (never a serve)
    const r = pos[sh.recv], B = BODY[sh.recv];
    if (!sh.isServe && Math.sign(ball.y) === sideSign(sh.recv) && ball.z > 0.2 && ball.z < PLAYERS[sh.recv].heightM * 1.25) {
      const d = Math.hypot(ball.x - r.x, ball.y - r.y), passing = d > sh.prevV;
      sh.prevV = d;
      if (d <= B.reach * B.volleyReach && (passing || d < 0.5 * B.reach)) return hitBall(sh.recv, false, true);
    }
    return;
  }
  if (!sh.bounced) {
    sh.bounced = true;
    if (sh.serve) {
      if (sh.serve.fault) return rally.serveNo === 1 ? retakeServe(2, sh.serve.net ? "NET · FAULT" : "FAULT") : endPoint(sh.recv, "DOUBLE FAULT");
      if (sh.serve.let) return retakeServe(rally.serveNo, "LET · " + (rally.serveNo === 1 ? "FIRST" : "SECOND") + " SERVE");
    }
    if (sh.out) return endPoint(sh.recv, "OUT");
  }
  const u = (sh.t - sh.t1) / sh.t2;               // past 1 the ball keeps travelling
  ball.x = sh.bounce.x + (sh.end.x - sh.bounce.x) * u + sh.kick.side * u;   // a kick serve jumps sideways after the bounce
  ball.y = sh.bounce.y + (sh.end.y - sh.bounce.y) * u;
  ball.z = Math.max(0, sh.end.z * u + 3.6 * SURF().bounce * sh.kick.up * u * (1 - u));   // clay higher, grass lower; kick jumps up, slice skids
  if (u >= 0.3 && !(sh.serve && sh.serve.ace)) {          // an ace is out of reach by definition
    // contact: in reach, and either at the ideal point or the ball is starting to pass you
    const r = pos[sh.recv], d = Math.hypot(ball.x - r.x, ball.y - r.y);
    const passing = d > sh.prevD;
    sh.prevD = d;
    const reach = BODY[sh.recv].reach * (sh.isServe ? 1.15 : 1);    // returners stretch further for a serve
    if (d <= reach && (u >= 0.95 || passing)) return hitBall(sh.recv, false);
  }
  if (u >= 1.28) {                                 // second bounce
    const who = PLAYERS[sh.hitter].last;
    endPoint(sh.hitter, sh.serve && sh.serve.ace ? `ACE — ${who}` : sh.recv === 0 ? `${who} — OUT OF REACH` : `WINNER — ${who}`);
  }
}

function gamesPlayed() {
  return S.sets.reduce((n, st) => n + st.g[0] + st.g[1], 0) + S.games[0] + S.games[1];
}

function endPoint(winner, call) {
  const before = rally;
  rally = null;
  awardPoint(winner);
  toast(call);
  // stamina only partly comes back: more at a changeover or set break, and the ceiling slowly drops
  const setBreak = S.sets.length !== before.sets;
  const changeover = gamesPlayed() !== before.games && gamesPlayed() % 2 === 1;
  const rest = setBreak ? 0.8 : changeover ? 0.65 : 0.35;
  pos.forEach(p => {
    p.cap = Math.max(55, p.cap - Math.max(0, p.stamAtStart - p.stam) * 0.03);
    p.restTo = p.stam + (p.cap - p.stam) * Math.min(1, rest * BODY[pos.indexOf(p)].recoverMul);   // Endurance
  });
  afterPoint();
}

function afterPoint() {
  renderScore();
  if (S.over) { bug.classList.remove("live"); showResult(); return; }
  after(0.9, () => {                                     // game time, so a pause freezes it
    pos.forEach(p => { if (p.restTo != null) { p.stam = Math.min(p.cap, p.restTo); p.restTo = null; } });
    bug.classList.remove("live"); resetPositions(); renderScore();
  });
  queueServe(BETWEEN_POINTS, 1);                         // next point serves itself ~4 s later
}
/* A fault or a let: no point is played; serve again (2nd serve after a fault, the same serve after a let). */
function retakeServe(no, call) {
  rally = null;
  toast(call);
  after(0.4, () => { resetPositions(); renderScore(); });
  queueServe(BETWEEN_SERVES, no);
}

/* =====================================================================
   LOOP
   ===================================================================== */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);                          // schedule first, so one bad frame can't stop the game
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = Math.max(last, now);   // never step backwards in time
  if (!innerWidth || !innerHeight) return;              // hidden / zero-size window: nothing to draw
  if (canvas.width !== innerWidth || canvas.height !== innerHeight) resize();
  if (!paused) {                                          // a pause freezes the game clock, the rally and the serve timer
    gameT += dt; runTimers();
    if (rally) { clock += dt; stepRally(dt); }
    else { pos.forEach(p => { p.moving = false; }); readyStep(dt); }
    updateCamera(dt);
  }
  drawCourt();
  const firstPerson = camMode === "pov";                  // in first person you don't see yourself
  const items = [
    { y: pos[1].y, draw: () => drawPlayer(1, pos[1], swing[1]) },
    { y: 0, draw: drawNet },
    { y: -99, draw: drawAim }
  ];
  if (!firstPerson) items.push({ y: pos[0].y + 0.001, draw: drawReach }, { y: pos[0].y, draw: () => drawPlayer(0, pos[0], swing[0]) });
  if (ball) items.push({ y: ball.y - 0.01, draw: () => drawBall(ball) });
  actx.setTransform(1, 0, 0, 1, 0, 0); actx.clearRect(0, 0, abuf.width, abuf.height);
  actx.setTransform(AS, 0, 0, AS, 0, 0); actx.imageSmoothingEnabled = false;
  b = actx;                                              // actors go on the finer layer, far to near
  drawShadows();                                         // cast shadows first: everything stands on top of them
  items.sort((a, c) => c.y - a.y).forEach(it => it.draw());
  b = bMain;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, canvas.width, canvas.height);
  ctx.drawImage(abuf, 0, 0, canvas.width, canvas.height);
  drawSunlight();
  renderHud();
  renderReady();
}

/* Your serve target: a ball-yellow cross in the service box while you aim (and while the serve flies). */
function drawAim() {
  const aiming = S.server === 0 && ((nextServe && nextServe.ready) || (rally && (rally.serve || (rally.shot && rally.shot.isServe && !rally.shot.bounced))));
  if (!aiming) return;
  const bx = serviceBox(0);
  b.strokeStyle = "rgba(216,238,76,0.35)"; b.lineWidth = 1;     // the box you must land in
  const c = [proj(bx.xlo, bx.ylo), proj(bx.xhi, bx.ylo), proj(bx.xhi, bx.yhi), proj(bx.xlo, bx.yhi)];
  b.beginPath(); c.forEach((p, i) => (i ? b.lineTo(p.x, p.y) : b.moveTo(p.x, p.y))); b.closePath(); b.stroke();
  const p = proj(aim.x, aim.y), r = Math.max(2, p.s * 0.35);
  b.strokeStyle = "#d8ee4c"; b.lineWidth = 2;
  b.beginPath(); b.moveTo(p.x - r, p.y - r * 0.4); b.lineTo(p.x + r, p.y + r * 0.4); b.moveTo(p.x + r, p.y - r * 0.4); b.lineTo(p.x - r, p.y + r * 0.4); b.stroke();
}

/* READY countdown before each serve, with what to do. */
const readyEl = document.getElementById("ready"), readyBig = document.getElementById("readyBig"), readySmall = document.getElementById("readySmall");
function renderReady() {
  const positioning = nextServe && nextServe.ready && !rally, serving = rally && rally.serve;
  if (paused || S.over || !(positioning || serving)) { readyEl.hidden = true; return; }
  readyEl.hidden = false;
  const no = positioning ? nextServe.no : rally.serveNo;
  const who = S.server === 0 ? "YOUR SERVE" : `${PLAYERS[S.server].last} TO SERVE`;
  readyBig.textContent = positioning ? "GET SET" : "";
  readySmall.textContent = `${who} · ${no === 2 ? "2ND" : "1ST"} SERVE · ` +
    (S.server === 0 ? (positioning ? "WASD: YOUR SPOT · ARROWS / CLICK: AIM" : "ARROWS / CLICK: AIM · V: FIRST PERSON") : "WASD: MOVE INTO POSITION");
}

/* Faint ground ring = Sinner's real reach (arm + racket), so you can learn your body */
function drawReach() {
  const p = pos[0], r = BODY[0].reach, c = proj(p.x, p.y);
  const rx = proj(p.x + r, p.y).x - c.x, ry = Math.abs(proj(p.x, p.y - r).y - proj(p.x, p.y + r).y) / 2;
  b.strokeStyle = "rgba(216,238,76,0.28)"; b.lineWidth = 1;
  b.beginPath(); b.ellipse(Math.round(c.x), Math.round(c.y), rx, Math.max(1, ry), 0, 0, Math.PI * 2); b.stroke();
}

const hudEls = [0, 1].map(i => ({ st: document.getElementById("st" + i), cap: document.getElementById("cap" + i) }));
function renderHud() {
  [0, 1].forEach(i => {
    hudEls[i].st.style.width = pos[i].stam.toFixed(1) + "%";
    hudEls[i].cap.style.left = `calc(${pos[i].cap.toFixed(1)}% - 2px)`;
  });
}
/* Names, colours and body numbers on the HUD and buttons follow whoever you picked. */
function labelPlayers() {
  [0, 1].forEach(i => {
    const P = PLAYERS[i];
    document.getElementById("st" + i).style.background = P.ui || P.shirt;
  });
  document.getElementById("lblA").textContent = "Point " + PLAYERS[0].last.charAt(0) + PLAYERS[0].last.slice(1).toLowerCase();
  document.getElementById("lblB").textContent = "Point " + PLAYERS[1].last.charAt(0) + PLAYERS[1].last.slice(1).toLowerCase();
  document.getElementById("dotA").style.background = PLAYERS[0].ui;
  document.getElementById("dotB").style.background = PLAYERS[1].ui;
  canvas.setAttribute("aria-label", `Pixel tennis court: ${PLAYERS[0].first} ${PLAYERS[0].last} (you) near side, ${PLAYERS[1].first} ${PLAYERS[1].last} far side`);
}
labelPlayers();

/* =====================================================================
   UI WIRING
   ===================================================================== */
function manualPoint(p) {
  if (S.over || rally) return;
  awardPoint(p);
  renderScore();
  resetPositions();
  if (S.over) { cancelServe(); showResult(); } else queueServe(BETWEEN_POINTS, 1);
}
function undo() {
  if (!history.length || rally) return;
  S = JSON.parse(history.pop());
  document.getElementById("result").hidden = true;
  resetPositions(); renderScore(); queueServe(BETWEEN_POINTS, 1);
}
function showResult() {
  const w = S.winner;
  document.getElementById("resultName").textContent = `${PLAYERS[w].first} ${PLAYERS[w].last.charAt(0)}${PLAYERS[w].last.slice(1).toLowerCase()}`;
  document.getElementById("resultLine").textContent = S.sets.map(st => {
    const a = st.g[w], c = st.g[1 - w];
    return st.tb ? `${a}–${c}(${Math.min(st.tb[0], st.tb[1])})` : `${a}–${c}`;
  }).join("  ");
  document.getElementById("result").hidden = false;
}
function openSetup(step = 0) {                           // exit to the start flow (welcome → match → court → locker room)
  rally = null; cancelServe(); setPaused(false);         // leaving stops the match where it is
  pos.forEach(p => (p.motion = null));
  document.getElementById("result").hidden = true;
  StartFlow.open(step, matchLive() ? resumeFromMenu : null);
}
let matchOn = false;                                     // set when a match starts, so you can go back to it from the menu
const matchLive = () => matchOn && !S.over;
function resumeFromMenu() { resetPositions(); renderScore(); queueServe(READY + 0.5, 1); }   // "Back to match" from the welcome page

/* PAUSE (Esc): freezes the game clock, the rally and the serve countdown. */
const pauseEl = document.getElementById("pause");
function setPaused(on) {
  if (on && (StartFlow.isOpen() || S.over)) return;
  paused = on; pauseEl.hidden = !on; input.keys.clear();
  if (on) {
    document.getElementById("pauseScore").textContent = `${PLAYERS[0].last} ${S.games[0]}–${S.games[1]} ${PLAYERS[1].last} · ${umpireCall()}`;
    document.getElementById("resumeBtn").focus();
  }
}
/* Called by the start flow (src/start/flow.js) with everything the player chose. */
function startMatch({ bestOf, tbTo, surface, playerId, firstServer }) {
  cfg.bestOf = bestOf; cfg.tbTo = tbTo; cfg.surface = surface;
  choosePlayers(playerId, surface); labelPlayers();
  cfg.firstServer = firstServer === "r" ? (Math.random() < 0.5 ? 0 : 1) : +firstServer;
  S = freshState(); history = []; matchOn = true;
  rally = null; cancelServe(); setPaused(false);
  resetBodies(); resetPositions(); renderScore();
  if (firstServer === "r") toast(`Coin toss: ${PLAYERS[cfg.firstServer].last} serves first`);
  queueServe(READY + 1.0, 1);                            // the first serve comes by itself after a short READY
}
window.startMatch = startMatch;
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2200);
}

document.getElementById("pauseBtn").onclick = () => setPaused(!paused);
document.getElementById("resumeBtn").onclick = () => setPaused(false);
document.getElementById("pauseNew").onclick = () => openSetup(1);
document.getElementById("slideBtn").onclick = () => slide(0);
/* Touch: tap Slice to arm your next shot as a slice (it disarms after one shot). */
const sliceBtn = document.getElementById("sliceBtn");
sliceBtn.onclick = () => { input.slice = !input.slice; sliceBtn.setAttribute("aria-pressed", String(input.slice)); sliceBtn.classList.toggle("primary", input.slice); };
document.getElementById("ptA").onclick = () => manualPoint(0);
document.getElementById("ptB").onclick = () => manualPoint(1);
document.getElementById("undoBtn").onclick = undo;
document.getElementById("newBtn").onclick = () => openSetup(1);
document.getElementById("againBtn").onclick = () => openSetup(1);
document.getElementById("splitBtn").onclick = () => splitStep(0);
const MOVE_KEYS = ["w", "a", "s", "d", "e", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"];   // WASD moves, arrows aim, E held = slice
const keyOf = e => (e.key.length === 1 ? e.key.toLowerCase() : e.key);   // W and w (Shift held) are the same key
addEventListener("keyup", e => input.keys.delete(keyOf(e)));
addEventListener("blur", () => input.keys.clear());
addEventListener("keydown", e => {
  if (StartFlow.isOpen()) return;
  if (e.key === "Escape") {                               // Esc = pause / resume (another open panel closes itself first)
    const other = [...document.querySelectorAll('[role="dialog"]')].some(d => d.offsetParent && !pauseEl.contains(d));
    if (!other && document.getElementById("result").hidden) { e.preventDefault(); setPaused(!paused); }
    return;
  }
  if (paused) return;
  if (MOVE_KEYS.includes(keyOf(e))) { e.preventDefault(); input.keys.add(keyOf(e)); return; }
  if (e.key === "Shift") { if (!e.repeat) splitStep(0); return; }
  if (e.target.closest && e.target.closest("button") && e.code === "Space") return;
  if (e.code === "Space") { e.preventDefault(); if (!e.repeat) slide(0); }   // Space = slide (points now serve by themselves)
  else if (e.key === "v" || e.key === "V") { firstPersonServe = !firstPersonServe; toast(firstPersonServe ? "FIRST-PERSON SERVE ON" : "SERVE CAM ON"); }
  else if (e.key === "1") manualPoint(0);                 // test keys (A and L now belong to movement)
  else if (e.key === "2") manualPoint(1);
  else if (e.key === "z" || e.key === "Z") undo();
});
addEventListener("resize", resize);

/* Touch / mouse: drag on the court = virtual stick (screen up = toward the net) */
const stick = document.getElementById("stick"), knob = document.getElementById("knob");
let stickOrigin = null, aimDrag = null;
/* Screen point → court point on the ground (inverse of proj with z = 0). */
function screenToCourt(cx, cy) {
  const sx = cx / innerWidth * BW, sy = cy / innerHeight * BH;
  if (sy <= HZ + 1) return null;                         // above the horizon: not on the court
  const d = F * CAM_H / (sy - HZ);
  return { x: (sx - BW / 2) * d / F + CAM_X, y: d - CAM_BACK };
}
const aimingNow = () => S.server === 0 && !paused && ((nextServe && nextServe.ready && !rally) || (rally && rally.serve));
function aimAt(cx, cy) {
  const c = screenToCourt(cx, cy); if (!c) return;
  const bx = serviceBox(0);
  aim.x = clamp(c.x, bx.xlo + 0.05, bx.xhi - 0.05);
  aim.y = clamp(c.y, bx.sy * 1.5, bx.sy * (COURT.SVC - 0.05));
}
canvas.addEventListener("pointerdown", e => {
  if (aimingNow()) {                                      // serving: click / tap (and drag) to aim; you can't run during the windup anyway
    const c = screenToCourt(e.clientX, e.clientY);
    if (c && Math.sign(c.y) === serviceBox(0).sy) { aimDrag = e.pointerId; canvas.setPointerCapture(e.pointerId); aimAt(e.clientX, e.clientY); return; }
  }
  stickOrigin = { x: e.clientX, y: e.clientY, id: e.pointerId };
  canvas.setPointerCapture(e.pointerId);
  stick.style.left = e.clientX + "px"; stick.style.top = e.clientY + "px"; stick.hidden = false;
  knob.style.transform = "";
});
canvas.addEventListener("pointermove", e => {
  if (aimDrag === e.pointerId) { aimAt(e.clientX, e.clientY); return; }
  if (!stickOrigin || e.pointerId !== stickOrigin.id) return;
  let dx = (e.clientX - stickOrigin.x) / 40, dy = (e.clientY - stickOrigin.y) / 40;
  const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; }
  input.stick = { x: dx, y: -dy };
  knob.style.transform = `translate(${dx * 30}px, ${dy * 30}px)`;
});
const endStick = () => { stickOrigin = null; aimDrag = null; input.stick = { x: 0, y: 0 }; stick.hidden = true; };
canvas.addEventListener("pointerup", endStick);
canvas.addEventListener("pointercancel", endStick);

resize(); resetPositions(); renderScore(); requestAnimationFrame(frame);
</script>
