<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tennis101 Match Court</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Silkscreen&display=swap">
<style>
/* Layout: full-bleed pixel night-session court canvas; broadcast scorebug pinned bottom-left, raised 1/8 of the screen height; match controls along the bottom edge. Single dark look by choice (night match). */
:root {
  --night: #0a1120;
  --panel: #0e1729;
  --panel-2: #16233c;
  --line: #2a3b5e;
  --ink: #eef3fb;
  --muted: #8b9cbc;
  --ball: #d8ee4c;
  --chip-ink: #0a1120;
  --sinner: #23b59c;
  --alcaraz: #e2544a;
  --f-name: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-pix: "Silkscreen", "Courier New", monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--ink); font-family: var(--f-name); overflow: hidden; }
#court { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }

/* ---------- Scoreboard (bottom-left, 1/8 above the bottom) ---------- */
.scorebug {
  position: fixed;
  left: max(16px, env(safe-area-inset-left, 0px));
  bottom: calc(12.5% + env(safe-area-inset-bottom, 0px));
  z-index: 5;
  min-width: 260px;
  max-width: calc(100% - 32px);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: 0 10px 30px rgb(0 0 0 / .45);
  overflow: hidden;
  opacity: 1;
  transition: opacity .35s ease;
}
.scorebug.live { opacity: .34; }
.sb-head {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 5px 10px; background: var(--panel-2);
  font-family: var(--f-pix); font-size: 9px; letter-spacing: .06em; color: var(--muted);
}
.sb-head .tag-tb { color: var(--ball); }
.sb-grid { display: grid; align-items: stretch; font-variant-numeric: tabular-nums; }
.sb-cell { display: flex; align-items: center; justify-content: center; height: 34px; }
.sb-row + .sb-row { border-top: 1px solid var(--line); }
.sb-serve { width: 22px; }
.sb-serve i { width: 9px; height: 9px; border-radius: 50%; background: var(--ball); box-shadow: 0 0 0 2px rgb(216 238 76 / .18); }
.sb-name { justify-content: flex-start; gap: 7px; padding-right: 14px; min-width: 0; }
.sb-name .stripe { width: 4px; height: 18px; border-radius: 1px; }
.sb-name b { font-size: 21px; font-weight: 700; letter-spacing: .02em; line-height: 1; white-space: nowrap; }
.sb-name small { font-family: var(--f-pix); font-size: 8px; color: var(--muted); letter-spacing: .08em; }
.sb-set { width: 26px; font-family: var(--f-num); font-size: 16px; color: var(--muted); }
.sb-set.won { color: var(--ink); font-weight: 600; }
.sb-set sup { font-size: 9px; margin-left: 1px; transform: translateY(-4px); }
.sb-cur { width: 30px; font-family: var(--f-num); font-size: 17px; font-weight: 600; background: var(--panel-2); }
.sb-pts { width: 46px; font-family: var(--f-num); font-size: 17px; font-weight: 600; background: var(--ink); color: var(--chip-ink); }
.sb-pts.adv { background: var(--ball); }
.sb-call {
  padding: 5px 10px; border-top: 1px solid var(--line);
  font-family: var(--f-pix); font-size: 10px; letter-spacing: .06em; color: var(--ink);
  display: flex; justify-content: space-between; gap: 10px;
}
.sb-call span:last-child { color: var(--muted); }

/* ---------- Bottom controls ---------- */
.controls {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px;
  pointer-events: none;
}
.controls > * { pointer-events: auto; }
.btn {
  font-family: var(--f-name); font-size: 15px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 5px;
  padding: 7px 12px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center;
}
.btn:hover { background: var(--panel-2); }
.btn:focus-visible { outline: 2px solid var(--ball); outline-offset: 2px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn kbd { font-family: var(--f-pix); font-size: 8px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 1px 4px; }
.btn.primary { background: var(--ball); color: var(--chip-ink); border-color: var(--ball); }
.btn.primary kbd { color: var(--chip-ink); border-color: rgb(10 17 32 / .35); }
.btn .dot { width: 8px; height: 8px; border-radius: 50%; }

.home-btn { position: fixed; z-index: 6; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); }
.cam-tag {
  position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px));
  font-family: var(--f-pix); font-size: 9px; letter-spacing: .1em; color: var(--chip-ink); background: var(--ball); border-radius: 4px; padding: 5px 8px;
}
.ready {
  position: fixed; z-index: 6; left: 50%; top: 22%; transform: translateX(-50%); text-align: center; pointer-events: none;
  font-family: var(--f-pix); color: var(--ink); text-shadow: 0 3px 0 rgb(0 0 0 / .45);
}
.ready b { display: block; font-size: clamp(28px, 6vw, 54px); font-weight: 400; letter-spacing: .06em; color: var(--ball); }
.ready span { display: block; font-size: 10px; letter-spacing: .1em; margin-top: 8px; }
.pause-actions { display: grid; gap: 8px; }
.pause-actions .btn { justify-content: center; font-size: 17px; padding: 10px; }
.x-btn { position: absolute; top: 14px; right: 14px; font-family: var(--f-name); font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 5px 10px; cursor: pointer; }
.x-btn:focus-visible { outline: 2px solid var(--ball); outline-offset: 2px; }
.card { position: relative; }
.toast {
  position: fixed; z-index: 8; left: 50%; top: 30%; transform: translateX(-50%);
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 7px 12px;
  font-family: var(--f-pix); font-size: 10px; letter-spacing: .05em; max-width: calc(100% - 32px);
}

/* ---------- Match setup / result overlay ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
  background: rgb(6 10 20 / .72);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
.card {
  width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 22px; display: grid; gap: 18px;
}
.card h1 { margin: 0; font-size: 34px; line-height: 1; font-weight: 700; letter-spacing: .01em; text-wrap: balance; }
.card h1 em { font-style: normal; color: var(--muted); font-weight: 500; }
.eyebrow { font-family: var(--f-pix); font-size: 9px; letter-spacing: .1em; color: var(--ball); margin: 0 0 8px; }
.field { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; }
.field legend { font-family: var(--f-pix); font-size: 9px; letter-spacing: .08em; color: var(--muted); padding: 0; margin-bottom: 8px; }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; }
.seg label { position: relative; cursor: pointer; }
.seg input { position: absolute; opacity: 0; inset: 0; }
.seg span {
  display: grid; gap: 2px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel-2);
  font-size: 18px; font-weight: 600;
}
.seg span small { font-family: var(--f-name); font-size: 13px; font-weight: 500; color: var(--muted); }
.seg input:checked + span { border-color: var(--ball); box-shadow: inset 0 0 0 1px var(--ball); }
.seg input:focus-visible + span { outline: 2px solid var(--ball); outline-offset: 2px; }
.card .btn.primary { justify-content: center; font-size: 18px; padding: 11px; }
.result-line { font-family: var(--f-num); font-size: 18px; margin: 0; }

/* ---------- Body HUD (top-right): stamina, speed, split-step feedback ---------- */
.stamina { position: fixed; z-index: 5; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  width: 120px; display: grid; gap: 4px; pointer-events: none; }
.stamina-label { font-family: var(--f-pix); font-size: 7px; letter-spacing: .1em; color: rgb(238 243 251 / .75); text-shadow: 0 1px 0 rgb(0 0 0 / .5); }
.bar { position: relative; height: 5px; background: rgb(14 23 41 / .65); border-radius: 2px; overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; }
.bar .cap { position: absolute; top: 0; bottom: 0; width: 2px; background: rgb(238 243 251 / .7); }
.callout { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  font-family: var(--f-pix); font-size: 10px; letter-spacing: .08em; color: var(--ball); text-shadow: 0 2px 0 rgb(0 0 0 / .55);
  pointer-events: none; white-space: nowrap; }
.stick {
  position: fixed; z-index: 7; width: 96px; height: 96px; margin: -48px 0 0 -48px;
  border-radius: 50%; border: 1px solid rgb(238 243 251 / .35); pointer-events: none;
}
.stick i { position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; background: rgb(238 243 251 / .3); }
#court { touch-action: none; }

@media (max-width: 480px) {
  .cam-tag { top: calc(56px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); transform: none; font-size: 8px; }
  .sb-name b { font-size: 18px; }
  .sb-cell { height: 30px; }
  .btn { font-size: 13px; padding: 6px 9px; }
  .btn kbd { display: none; }
}
@media (prefers-reduced-motion: reduce) { .scorebug { transition: none; } }
</style>

<canvas id="court" aria-label="Pixel tennis court: Jannik Sinner near side, Carlos Alcaraz far side"></canvas>


<!-- Stamina only (no box, no heights or weights: Ryan's call). Messages (split-step, slide, ace chance) pop up above the buttons. -->
<div class="stamina" aria-label="Stamina">
  <span class="stamina-label">STAMINA</span>
  <div class="bar"><i id="st0" style="background:var(--sinner)"></i><span class="cap" id="cap0"></span></div>
  <div class="bar"><i id="st1" style="background:var(--alcaraz)"></i><span class="cap" id="cap1"></span></div>
</div>
<div class="callout" id="hudMsg" aria-live="polite"></div>
<div class="stick" id="stick" hidden><i id="knob"></i></div>
<div class="cam-tag" id="camTag" hidden>NET CAM · VOLLEY</div>
<div class="ready" id="ready" hidden aria-live="polite"><b id="readyBig">READY</b><span id="readySmall"></span></div>

<section class="scorebug" id="scorebug" aria-live="polite" aria-label="Scoreboard"></section>

<div class="controls">
  <button class="btn primary" id="pauseBtn" type="button">Pause <kbd>ESC</kbd></button>
  <button class="btn" id="slideBtn" type="button">Slide <kbd>SPACE</kbd></button>
  <button class="btn" id="splitBtn" type="button">Split step <kbd>SHIFT</kbd></button>
  <button class="btn" id="sliceBtn" type="button" aria-pressed="false">Slice <kbd>E</kbd></button>
  <button class="btn" id="ptA" type="button"><span class="dot" id="dotA" style="background:var(--sinner)"></span><span id="lblA">Point Sinner</span> <kbd>1</kbd></button>
  <button class="btn" id="ptB" type="button"><span class="dot" id="dotB" style="background:var(--alcaraz)"></span><span id="lblB">Point Alcaraz</span> <kbd>2</kbd></button>
  <button class="btn" id="undoBtn" type="button">Undo <kbd>Z</kbd></button>
  <button class="btn" id="newBtn" type="button">New match</button>
</div>

<div class="overlay" id="result" hidden>
  <div class="card">
    <div>
      <p class="eyebrow">GAME, SET AND MATCH</p>
      <h1 id="resultName">Sinner</h1>
    </div>
    <p class="result-line" id="resultLine"></p>
    <button class="btn primary" type="button" id="againBtn">New match</button>
  </div>
</div>

<div class="overlay" id="pause" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
    <div><p class="eyebrow">MATCH PAUSED</p><h1 id="pauseTitle">Paused</h1></div>
    <p class="muted" id="pauseScore" style="margin:0;color:var(--muted)"></p>
    <div class="pause-actions">
      <button class="btn primary" type="button" id="resumeBtn">Resume <kbd>ESC</kbd></button>
      <button class="btn" type="button" id="pauseNew">New match</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<!-- Skill points (Skills Coach) and Sinner's real serve, captured from video (Serve Analyst) -->
<script src="src/skills/skills.js?v=0.11.0"></script>
<script src="src/animation/run-cycle.js?v=0.11.0"></script>
<script src="src/serve/motion/sinner-serve.js?v=0.11.0"></script>
<script>
/* =====================================================================
   PLAYERS — real measurements drive sprite height (and later, physics)
   ===================================================================== */
const ROSTER = [
  { id: "sinner",  last: "SINNER",  first: "Jannik", code: "ITA", heightM: 1.91, weightKg: 77, shirt: "#23b59c", shorts: "#11233a", hair: "#c4672f", letRate: 0.02,
    // outfit per court, from his clips (datasets/players/sinner/outfits.json); grass = all white (dress code)
    outfits: { clay:  { shirt: "#141418", shorts: "#1e1d22", cap: "#16161b", shoes: "#1c1b20" },
               hard:  { shirt: "#1f2f4a", shorts: "#f5f5f2", cap: "#f2f2ef", shoes: "#f0ece6" },
               grass: { shirt: "#f4f4f0", shorts: "#f4f4f0", cap: "#f4f4f0", shoes: "#f4f4f0" } },
    // SIGNATURE (datasets/players/sinner/appearance.json, Ryan's call): the iconic cap, bright ginger curls flaring out under it
    look: { style: "cap-curls" } },
  { id: "alcaraz", last: "ALCARAZ", first: "Carlos", code: "ESP", heightM: 1.83, weightKg: 74, shirt: "#e2544a", shorts: "#f1f1ec", hair: "#2a1c14", letRate: 0.03,
    // outfits from Ryan's clips (datasets/players/alcaraz/appearance.json): US Open grey fade sleeveless top + black, a black arm sleeve;
    // clay stands in with his orange kit until a clay clip exists; all white on grass (dress code)
    outfits: { hard:  { shirt: "#3c3f45", shirtLow: "#a3a7ad", shorts: "#1f2024", shoes: "#1d1d20", socks: "#141416", sleeve: "#121214" },
               clay:  { shirt: "#ef6a2c", shorts: "#f4f4f0", shoes: "#a6e04a" },
               grass: { shirt: "#f4f4f0", shorts: "#f4f4f0", shoes: "#f4f4f0" } },
    // SIGNATURE (Ryan's call): his current look, long outgrown hair and a full beard, held back by a white hairband
    look: { style: "long-band", band: "#f6f6f2", beard: true } }
];
/* letRate = chance a serve that would land in clips the net cord first (a LET, served again). Estimates
   (lets happen on roughly 1–3% of pro serves); the Serve Analyst refines them from match data. */
/* PLAYERS[0] = you (near court), PLAYERS[1] = your opponent (far court). Filled by choosePlayers(). */
const PLAYERS = [];

/* Body-driven movement numbers, relative to a 1.85 m / 75 kg reference athlete.
   Every trait is a trade-off: height buys stride (top speed) and reach but costs first-step quickness. */
function bodyStats(P) {
  const h = P.heightM / 1.85, w = P.weightKg / 75;
  return {
    top: 6.6 * Math.sqrt(h) / Math.pow(w, 0.25),   // m/s: longer stride raises top speed, mass lowers it (raised from 5.3: Ryan wanted faster)
    accel: 8.6 / w / Math.sqrt(h),                 // m/s²: lighter and shorter = quicker first step (was 7.0)
    brake: 11.0 / w,                               // m/s²: stopping or changing direction fights your own mass (was 9.0)
    reach: 0.44 * P.heightM + 0.69,                // m: arm + racket from body centre
    drain: w                                       // heavier body spends more stamina per effort
  };
}
let BODY = [];
/* You pick a pro in the locker room: they go to the near court, the other pro is your opponent.
   Each body = height/weight physics (bodyStats) + skill points (src/skills/skills.js). */
function choosePlayers(youId, surface = "hard") {
  const you = ROSTER.find(r => r.id === youId) || ROSTER[0], opp = ROSTER.find(r => r !== you);
  const dress = P => ({ ...P, ui: P.shirt, ...(P.outfits && P.outfits[surface] || {}) });   // outfit for this court; ui keeps the signature colour for the HUD
  PLAYERS.splice(0, 2, { ...dress(you), side: "near" }, { ...dress(opp), side: "far" });
  BODY = PLAYERS.map(P => applySkills(bodyStats(P), getSkills(P.id)));
}
choosePlayers("sinner");
window.ROSTER = ROSTER;
window.PLAYERS = PLAYERS;   // captured-serve getPose reads the live pair; the array is mutated in place

/* =====================================================================
   SCORING ENGINE — pure state, no drawing
   ===================================================================== */
const cfg = { bestOf: 3, tbTo: 7, firstServer: 0, surface: "hard" };
const setsToWin = () => (cfg.bestOf === 5 ? 3 : 2);

function freshState() {
  return { sets: [], setsWon: [0, 0], games: [0, 0], points: [0, 0],
           tb: false, tbStarter: null, server: cfg.firstServer, over: false, winner: null };
}
let S = freshState();
let history = [];

function awardPoint(p) {
  if (S.over) return;
  history.push(JSON.stringify(S));
  const o = 1 - p;
  S.points[p]++;
  if (S.tb) {
    if (S.points[p] >= cfg.tbTo && S.points[p] - S.points[o] >= 2) {
      S.games[p]++;
      finishSet(p);
    } else if ((S.points[0] + S.points[1]) % 2 === 1) {
      S.server = 1 - S.server;          // tiebreak: change after point 1, then every 2 points
    }
  } else if (S.points[p] >= 4 && S.points[p] - S.points[o] >= 2) {
    finishGame(p);
  }
}

function finishGame(p) {
  const o = 1 - p;
  S.games[p]++;
  S.points = [0, 0];
  S.server = 1 - S.server;              // serve alternates every game
  if (S.games[p] >= 6 && S.games[p] - S.games[o] >= 2) {
    finishSet(p);                         // 6-0..6-4, or 7-5
  } else if (S.games[0] === 6 && S.games[1] === 6) {
    S.tb = true;
    S.tbStarter = S.server;               // whoever is due to serve starts the tiebreak
  }
}

function finishSet(p) {
  S.sets.push({ g: [...S.games], tb: S.tb ? [...S.points] : null, winner: p });
  S.setsWon[p]++;
  if (S.tb) S.server = 1 - S.tbStarter;  // receiver of the first tiebreak point serves the next set
  S.tb = false; S.tbStarter = null;
  S.games = [0, 0]; S.points = [0, 0];
  if (S.setsWon[p] === setsToWin()) { S.over = true; S.winner = p; }
}

function pointLabels() {
  const [a, b] = S.points;
  if (S.tb) return [String(a), String(b)];
  if (a >= 3 && b >= 3) {
    if (a === b) return ["40", "40"];
    return a > b ? ["AD", ""] : ["", "AD"];
  }
  const m = ["0", "15", "30", "40"];
  return [m[a], m[b]];
}

/* Umpire's call: server's score first, as said on court */
function umpireCall() {
  if (S.over) return "GAME, SET AND MATCH";
  const s = S.server, r = 1 - s, ps = S.points[s], pr = S.points[r];
  if (S.tb) return ps === pr ? `${ps} ALL` : `${ps}–${pr}`;
  if (ps >= 3 && pr >= 3) return ps === pr ? "DEUCE" : (ps > pr ? "AD IN" : "AD OUT");
  const w = ["LOVE", "15", "30", "40"];
  if (ps === pr) return ps === 0 ? "LOVE ALL" : `${w[ps]} ALL`;
  return `${w[ps]}–${w[pr]}`;
}

/* =====================================================================
   SCOREBOARD RENDER
   ===================================================================== */
const bug = document.getElementById("scorebug");
function renderScore() {
  const setNo = S.sets.length + 1;
  const cols = ["22px", "1fr", ...S.sets.map(() => "26px"), S.over ? null : "30px", S.over ? null : "46px"].filter(Boolean);
  const pts = pointLabels();
  const head = S.over
    ? `<span>FINAL</span><span>BEST OF ${cfg.bestOf}</span>`
    : `<span>${S.tb ? `<span class="tag-tb">TIEBREAK · FIRST TO ${cfg.tbTo}</span>` : `SET ${setNo}`}</span><span>BEST OF ${cfg.bestOf}</span>`;
  const rows = [0, 1].map(i => {
    const P = PLAYERS[i];
    const serving = !S.over && S.server === i;
    const setCells = S.sets.map(st => {
      const won = st.winner === i;
      const tbSup = st.tb && !won ? `<sup>${st.tb[i]}</sup>` : "";
      return `<div class="sb-cell sb-set${won ? " won" : ""}">${st.g[i]}${tbSup}</div>`;
    }).join("");
    const live = S.over ? "" :
      `<div class="sb-cell sb-cur">${S.games[i]}</div>` +
      `<div class="sb-cell sb-pts${pts[i] === "AD" ? " adv" : ""}">${pts[i]}</div>`;
    return `<div class="sb-grid sb-row" style="grid-template-columns:${cols.join(" ")}">
      <div class="sb-cell sb-serve">${serving ? '<i title="Serving" aria-label="Serving"></i>' : ""}</div>
      <div class="sb-cell sb-name"><span class="stripe" style="background:${P.ui || P.shirt}"></span><b>${P.last}</b><small>${P.code}</small></div>
      ${setCells}${live}
    </div>`;
  }).join("");
  const serverName = PLAYERS[S.server].first + " " + PLAYERS[S.server].last.charAt(0) + PLAYERS[S.server].last.slice(1).toLowerCase();
  const callRight = S.over ? `${PLAYERS[S.winner].last} WINS` : `${PLAYERS[S.server].last} TO SERVE`;

const SURFACES = {

/* CAST SHADOWS on the ground, from the light(s): a body-shaped silhouette from the feet away from each light,

  const R = (x, y, w, h, c) => { b.fillStyle = c; b.fillRect(q(x), q(y), Math.max(1 / AS, q(w)), Math.max(1 / AS, q(h))); };
  if (L.style === "cap-curls") {
    for (const sd of [-1, 1]) for (let k = 0; k < 3; k++) R(hx + sd * r * (1.0 + 0.12 * (k % 2)) - r * 0.18, hy + r * (0.0 + k * 0.32), r * 0.36, r * 0.3, k % 2 ? hrL : hr);
    const cap = P.cap || "#f2f2ef";
    b.fillStyle = cap; b.beginPath(); b.arc(hx, hy - r * 0.1, r * 1.18, Math.PI, Math.PI * 2); b.fill();   // oversized crown
    if (!near) R(hx - r * 1.6, hy - r * 0.16, r * 3.2, r * 0.26, shade(cap, -0.2));                        // long brim toward you
  }
  if (L.style === "long-band") {
    b.fillStyle = hr; b.beginPath(); b.arc(hx, hy - r * 0.2, r * 1.08, Math.PI * 0.15, Math.PI * 0.85); b.fill();   // hair down the nape
    b.beginPath(); b.arc(hx, hy - r * 0.28, r * 1.12, Math.PI, Math.PI * 2); b.fill();                              // crown
    if (!near) { R(hx - r * 1.15, hy - r * 0.15, r * 0.38, r * 1.35, hr); R(hx + r * 0.78, hy - r * 0.15, r * 0.38, r * 1.35, hr);
      if (L.beard) { R(hx - r * 0.7, hy + r * 0.32, r * 1.4, r * 0.62, hrD); R(hx - r * 0.22, hy + r * 0.55, r * 0.44, 1 / AS, "#b8695a"); } }
    b.strokeStyle = L.band || "#f6f6f2"; b.lineWidth = Math.max(1 / AS, r * 0.2); b.lineCap = "round";
    b.beginPath(); b.arc(hx, hy - r * 0.02, r * 0.9, Math.PI * 1.12, Math.PI * 1.88); b.stroke();                   // band follows the skull
  }
}

function drawCapturedFigure(i, p, W) {
  const P = PLAYERS[i], skin = "#e1b48b";
  const g = proj(p.x, p.y);
  /* VOLUME. The captured body is a set of world-space solids (tapered torso, round limbs, a skull),
     projected with whatever camera is on — behind, side, or the review slant. Screen-space cards collapse
     to a stick from the side; these keep a waist, a back and a face. Joints are not moved. */
  const lit = litLeft() ? -1 : 1;
  const Hm = P.heightM;
  const add3 = (a, c) => ({ x: a.x + c.x, y: a.y + c.y, z: a.z + c.z });
  const sub3 = (a, c) => ({ x: a.x - c.x, y: a.y - c.y, z: a.z - c.z });
  const mul3 = (a, s) => ({ x: a.x * s, y: a.y * s, z: a.z * s });
  const dot3 = (a, c) => a.x * c.x + a.y * c.y + a.z * c.z;
  const cross3 = (a, c) => ({ x: a.y * c.z - a.z * c.y, y: a.z * c.x - a.x * c.z, z: a.x * c.y - a.y * c.x });
  const depthKey = wpt => { const r = proj(wpt.x, wpt.y, wpt.z); return r.d != null ? r.d : -r.s; };
  const nearer = (wpt, than, slack = 0) => depthKey(wpt) < depthKey(than) + slack;
  const pxRadius = (wpt, rad) => {
    const c = proj(wpt.x, wpt.y, wpt.z);
    let w = 1.4 / AS;
    for (const d of [[rad, 0, 0], [0, rad, 0], [0, 0, rad]]) {
      const q = proj(wpt.x + d[0], wpt.y + d[1], wpt.z + d[2]);
      w = Math.max(w, Math.hypot(q.x - c.x, q.y - c.y));
    }
    return w;
  };
  const fillPoly = (pts, col) => {
    if (!pts.every(Boolean)) return;
    b.fillStyle = col; b.beginPath();
    pts.forEach((v, k) => (k ? b.lineTo(v.x, v.y) : b.moveTo(v.x, v.y)));
    b.closePath(); b.fill();
  };
  const capsule = (Aw, Cw, col, r0, r1) => {
    if (!Aw || !Cw) return;
    const A = proj(Aw.x, Aw.y, Aw.z), C = proj(Cw.x, Cw.y, Cw.z);
    const dx = C.x - A.x, dy = C.y - A.y, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
    const wA = pxRadius(Aw, r0), wC = pxRadius(Cw, r1);
    fillPoly([
      { x: A.x + nx * wA, y: A.y + ny * wA }, { x: C.x + nx * wC, y: C.y + ny * wC },
      { x: C.x - nx * wC, y: C.y - ny * wC }, { x: A.x - nx * wA, y: A.y - ny * wA },
    ], shade(col, -0.18));
    const o = lit * 0.28;
    fillPoly([
      { x: A.x + nx * wA * o, y: A.y + ny * wA * o }, { x: C.x + nx * wC * o, y: C.y + ny * wC * o },
      { x: C.x - nx * wC * 0.35, y: C.y - ny * wC * 0.35 }, { x: A.x - nx * wA * 0.35, y: A.y - ny * wA * 0.35 },
    ], col);
    b.fillStyle = shade(col, -0.08); b.beginPath(); b.arc(A.x, A.y, wA, 0, Math.PI * 2); b.fill();
    b.beginPath(); b.arc(C.x, C.y, wC, 0, Math.PI * 2); b.fill();
  };
  const LS = W.leftShoulder, RS = W.rightShoulder, LH = W.leftHip, RH = W.rightHip;
  const midW = (a, c) => a && c ? { x: (a.x + c.x) / 2, y: (a.y + c.y) / 2, z: (a.z + c.z) / 2 } : null;
  const sMid = midW(LS, RS), hMid = midW(LH, RH);
  let ax = 1, ay = 0, fx = 0, fy = 1;
  if (sMid && LS && RS) {
    ax = RS.x - LS.x; ay = RS.y - LS.y;
    const al = Math.hypot(ax, ay) || 1; ax /= al; ay /= al;
    fx = -ay; fy = ax;
    const nose = W.nose || { x: sMid.x, y: sMid.y + 0.05 * Hm };
    if ((nose.x - sMid.x) * fx + (nose.y - sMid.y) * fy < 0) { fx = -fx; fy = -fy; }
    if (Math.hypot(nose.x - sMid.x, nose.y - sMid.y) < 0.02 * Hm) { fx = 0; fy = -sideSign(i); }
  }
  const light = V3.norm({ x: lit < 0 ? -0.7 : 0.7, y: -0.2, z: 0.62 });
  const ringAt = (u, n = 8) => {
    const keys = [[0, 0.24, 0.15], [0.40, 0.145, 0.090], [0.72, 0.21, 0.17], [1, 0.28, 0.12]];
    let a = keys[0], c = keys[keys.length - 1];
    for (let k = 0; k < keys.length - 1; k++) if (u >= keys[k][0] && u <= keys[k + 1][0]) { a = keys[k]; c = keys[k + 1]; break; }
    const t = (u - a[0]) / ((c[0] - a[0]) || 1);
    const fw = (a[1] + (c[1] - a[1]) * t) * Hm, fd = (a[2] + (c[2] - a[2]) * t) * Hm;
    const ctr = V3.lerp(hMid, sMid, u);
    const pts = [];
    for (let k = 0; k < n; k++) {
      const ang = (k / n) * Math.PI * 2, side = Math.cos(ang) * fw / 2, fore = Math.sin(ang) * fd / 2;
      pts.push({ x: ctr.x + ax * side + fx * fore, y: ctr.y + ay * side + fy * fore, z: ctr.z, fore });
    }
    return { pts, ctr };
  };
  const drawTube = (us, col) => {
    if (!sMid || !hMid) return;
    const rings = us.map(u => ringAt(u));
    const quads = [];
    for (let s = 0; s < rings.length - 1; s++) {
      const A = rings[s].pts, C = rings[s + 1].pts, ctr = V3.lerp(rings[s].ctr, rings[s + 1].ctr, 0.5);
      for (let k = 0; k < A.length; k++) {
        const k2 = (k + 1) % A.length;
        quads.push({ pts: [A[k], A[k2], C[k2], C[k]], ctr });
      }
    }
    quads.sort((a, c) => (c.pts.reduce((s, p) => s + depthKey(p), 0)) - (a.pts.reduce((s, p) => s + depthKey(p), 0)));
    for (const qd of quads) {
      const e1 = sub3(qd.pts[1], qd.pts[0]), e2 = sub3(qd.pts[3], qd.pts[0]);
      let n = cross3(e1, e2), mid = qd.pts.reduce((s, p) => add3(s, p), { x: 0, y: 0, z: 0 });
      mid = mul3(mid, 1 / 4);
      if (dot3(n, sub3(mid, qd.ctr)) < 0) n = mul3(n, -1);
      n = V3.norm(n);
      const nd = Math.max(0, (dot3(n, light) + 0.35) / 1.25);
      fillPoly(qd.pts.map(p => proj(p.x, p.y, p.z)), shade(col, -0.30 + 0.46 * nd));
    }
    return rings;
  };
  const backOf = ring => ring.pts.reduce((m, p) => (p.fore < m.fore ? p : m), ring.pts[0]);
  // legs: thigh and shin as volumes, sock, then a shoe that points into the court
  for (const s of ["left", "right"]) {
    const Hp = W[s + "Hip"], Kn = W[s + "Knee"], An = W[s + "Ankle"];
    if (Hp && Kn) capsule(Hp, Kn, skin, 0.072 * Hm, 0.050 * Hm);
    if (Kn && An) capsule(Kn, An, skin, 0.048 * Hm, 0.036 * Hm);
    if (Kn && An) {
      const sockTop = V3.lerp(An, Kn, 0.22);
      capsule(sockTop, An, P.socks || "#f1f1ee", 0.040 * Hm, 0.034 * Hm);
    }
    if (An) {
      const toe = { x: An.x + fx * 0.13, y: An.y + fy * 0.13, z: Math.max(0.012, An.z - 0.01) };
      const heel = { x: An.x - fx * 0.045, y: An.y - fy * 0.045, z: Math.max(0.012, An.z - 0.008) };
      capsule(heel, toe, shade(P.shoes || "#f2f2f2", -0.42), 0.030 * Hm, 0.022 * Hm);
      capsule({ x: heel.x, y: heel.y, z: heel.z + 0.018 }, { x: toe.x, y: toe.y, z: toe.z + 0.012 }, P.shoes || "#f2f2f2", 0.034 * Hm, 0.026 * Hm);
    }
  }
  // hips and waist: shorts are wider at the pelvis and pinch at the waist
  if (sMid && hMid) {
    drawTube([0, 0.2, 0.42], P.shorts || "#1f2024");
    const shirtRings = drawTube([0.34, 0.55, 0.78, 1], P.shirt);
    const chest = ringAt(0.72), hip = ringAt(0.08);
    const front = chest.pts.reduce((m, p) => (p.fore > m.fore ? p : m), chest.pts[0]);
    if (shirtRings && nearer(backOf(chest), front, 0.05 * Hm)) {
      const seam = [hip, ringAt(0.38), chest, ringAt(1)].map(backOf);
      b.strokeStyle = shade(P.shirt, -0.38); b.lineWidth = Math.max(1.4 / AS, pxRadius(chest.ctr, 0.012 * Hm) * 2); b.lineCap = "round";
      b.beginPath();
      seam.forEach((p, k) => { const s = proj(p.x, p.y, p.z); k ? b.lineTo(s.x, s.y) : b.moveTo(s.x, s.y); });
      b.stroke();
    }
    for (const S0 of [LS, RS]) if (S0) {
      const c = proj(S0.x, S0.y, S0.z), rad = pxRadius(S0, 0.055 * Hm);
      b.fillStyle = shade(P.shirt, -0.06); b.beginPath(); b.arc(c.x, c.y, rad, 0, Math.PI * 2); b.fill();
    }
  }
  // arms, farther one first, so the near arm overlaps the chest. Sleeve on the hitting forearm.
  const arms = ["left", "right"].filter(s => W[s + "Shoulder"] && W[s + "Elbow"]);
  arms.sort((a, c) => depthKey(W[c + "Elbow"]) - depthKey(W[a + "Elbow"]));
  for (const s of arms) {
    const Sh = W[s + "Shoulder"], El = W[s + "Elbow"], Wr = W[s + "Wrist"];
    const sleeveEnd = V3.lerp(Sh, El, 0.46);
    capsule(Sh, El, skin, 0.046 * Hm, 0.038 * Hm);
    capsule(Sh, sleeveEnd, P.shirt, 0.052 * Hm, 0.044 * Hm);
    if (Wr) capsule(El, Wr, s === "right" && P.sleeve ? P.sleeve : skin, 0.036 * Hm, 0.028 * Hm);
    if (Wr) {
      const band = V3.lerp(Wr, El, 0.14);
      capsule(band, V3.lerp(Wr, El, 0.04), "#f3f3f0", 0.022 * Hm, 0.020 * Hm);
    }
    if (W[s + "Hand"] && Wr) capsule(Wr, W[s + "Hand"], skin, 0.026 * Hm, 0.020 * Hm);
  }
  // racket: a real 3D racket continuing the hitting forearm (right for a right-hander, left for Shelton, Nadal, Tien)
  const hitArm = (p.motion && p.motion.m && p.motion.m.hand === "L") ? "left" : "right";
  if (W[hitArm + "Elbow"] && W[hitArm + "Wrist"]) {
    const e = W[hitArm + "Elbow"], r = W[hitArm + "Wrist"], u = V3.norm({ x: r.x - e.x, y: r.y - e.y, z: r.z - e.z });
    const n = V3.norm({ x: 0, y: u.z, z: -u.y });          // face square to the forearm, toward the net
    drawRacket(r, u, n, RACKET_LOOK[P.id] || RACKET_LOOK.sinner);
  }
  // head: a skull with depth. The face is on the front hemisphere, so a slant or side camera sees it and a behind camera sees hair.
  const neck = W.neck || (sMid && { x: sMid.x, y: sMid.y, z: sMid.z + 0.04 * Hm });
  const noseW = W.nose;
  if (neck && noseW && P.side === "near") {
    const [hr, hrD, hrL] = HAIR[P.id] || [P.hair, P.hair, P.hair];
    const R = 0.105 * Hm;
    const center = { x: neck.x + fx * 0.02 * Hm, y: neck.y + fy * 0.02 * Hm, z: neck.z + 0.100 * Hm };
    capsule(sMid || neck, { x: center.x - fx * 0.01 * Hm, y: center.y - fy * 0.01 * Hm, z: center.z - R * 0.72 }, skin, 0.050 * Hm, 0.040 * Hm);
    const onSkull = (faceAmt, sideAmt, upAmt) => {
      const x = fx * faceAmt + ax * sideAmt, y = fy * faceAmt + ay * sideAmt, z = upAmt;
      const l = Math.hypot(x, y, z) || 1;
      return { x: center.x + x / l * R, y: center.y + y / l * R, z: center.z + z / l * R };
    };
    const longBand = P.look && P.look.style === "long-band";
    if (longBand) {
      const nape = onSkull(-0.9, 0, -0.2), tail = { x: nape.x - fx * R * 0.35, y: nape.y - fy * R * 0.35, z: neck.z };
      capsule(nape, tail, hr, R * 0.28, R * 0.16);
    }
    const c = proj(center.x, center.y, center.z), rad = pxRadius(center, R);
    b.fillStyle = hrD; b.beginPath(); b.arc(c.x, c.y, rad, 0, Math.PI * 2); b.fill();
    b.fillStyle = hr; b.beginPath(); b.arc(c.x, c.y - rad * 0.08, rad * 0.92, Math.PI, Math.PI * 2); b.fill();
    const facePt = onSkull(0.9, 0.22, 0.02), fc = proj(facePt.x, facePt.y, facePt.z);
    const faceOff = Math.hypot(fc.x - c.x, fc.y - c.y);
    const seeFace = nearer(facePt, center, R * 0.02) || faceOff > rad * 0.22;
    if (seeFace) {
      b.save(); b.beginPath(); b.arc(c.x, c.y, rad * 0.98, 0, Math.PI * 2); b.clip();
      b.fillStyle = skin; b.beginPath(); b.arc(fc.x, fc.y, rad * 0.74, 0, Math.PI * 2); b.fill();
      if (P.look && P.look.beard) {
        b.fillStyle = hrD;
        for (const jaw of [onSkull(0.62, 0.38, -0.5), onSkull(0.78, 0.12, -0.58), onSkull(0.5, 0, -0.82)]) {
          if (!nearer(jaw, center, R * 0.04) && Math.hypot(proj(jaw.x, jaw.y, jaw.z).x - c.x, proj(jaw.x, jaw.y, jaw.z).y - c.y) < rad * 0.2) continue;
          const j = proj(jaw.x, jaw.y, jaw.z);
          b.beginPath(); b.arc(j.x, j.y, rad * 0.32, 0, Math.PI * 2); b.fill();
        }
      }
      const dot = (wpt, col, sz) => {
        const d = proj(wpt.x, wpt.y, wpt.z);
        if (!nearer(wpt, center, R * 0.04) && Math.hypot(d.x - c.x, d.y - c.y) < rad * 0.18) return;
        b.fillStyle = col; b.fillRect(q(d.x - sz / 2), q(d.y - sz / 2), Math.max(1.4 / AS, sz), Math.max(1.4 / AS, sz));
      };
      dot(onSkull(0.78, 0.36, 0.16), "#1b1b1f", Math.max(2 / AS, rad * 0.2));
      dot(onSkull(0.78, -0.16, 0.16), "#1b1b1f", Math.max(2 / AS, rad * 0.2));
      dot(onSkull(0.8, 0.06, -0.4), "#a4574a", Math.max(1.6 / AS, rad * 0.18));
      b.restore();
      const nose = onSkull(1.15, 0.12, -0.02), np = proj(nose.x, nose.y, nose.z);
      b.fillStyle = shade(skin, -0.14); b.beginPath(); b.arc(np.x, np.y, Math.max(1.2 / AS, rad * 0.2), 0, Math.PI * 2); b.fill();
    }
    for (const sd of [1, -1]) {
      const ear = onSkull(0.02, sd, -0.08);
      if (!nearer(ear, center, -R * 0.01)) continue;
      const e = proj(ear.x, ear.y, ear.z);
      b.fillStyle = shade(skin, -0.08); b.beginPath(); b.ellipse(e.x, e.y, rad * 0.14, rad * 0.24, 0, 0, Math.PI * 2); b.fill();
    }
    if (longBand) {
      b.save(); b.beginPath(); b.arc(c.x, c.y, rad * 1.02, 0, Math.PI * 2); b.clip();
      b.strokeStyle = P.look.band || "#f6f6f2"; b.lineWidth = Math.max(1.4 / AS, rad * 0.18); b.lineCap = "round";
      b.beginPath();
      let pen = false;
      for (let k = 0; k <= 20; k++) {
        const ang = (k / 20) * Math.PI * 2;
        const wpt = { x: center.x + (ax * Math.cos(ang) + fx * Math.sin(ang) * 0.92) * R * 0.9, y: center.y + (ay * Math.cos(ang) + fy * Math.sin(ang) * 0.92) * R * 0.9, z: center.z + R * 0.22 };
        if (!nearer(wpt, center, -R * 0.015)) { pen = false; continue; }
        const d = proj(wpt.x, wpt.y, wpt.z);
        if (!pen) { b.moveTo(d.x, d.y); pen = true; } else b.lineTo(d.x, d.y);
      }
      b.stroke(); b.restore();
    } else sigHead(P, true, c.x, c.y, rad, hr, hrD, hrL);
  } else if (neck && noseW) {
    const r = Math.max(2, g.s * 0.12), hx = proj(noseW.x, noseW.y, noseW.z).x, hy = proj(noseW.x, noseW.y, noseW.z).y - g.s * 0.04;
    const [hr, hrD, hrL] = HAIR[P.id] || [P.hair, P.hair, P.hair];
    const px = 1 / AS, skinD = shade(skin, -0.18);
    b.fillStyle = skin; b.beginPath(); b.arc(hx, hy, r, 0, Math.PI * 2); b.fill();
    b.save(); b.beginPath(); b.arc(hx, hy, r, 0, Math.PI * 2); b.clip();
    b.fillStyle = shade(skin, -0.2); b.fillRect(lit > 0 ? hx - r : hx + r * 0.35, hy - r, r * 0.65, r * 2); b.restore();
    b.fillStyle = P.cap || hr; b.beginPath(); b.arc(hx, hy - r * 0.15, r * 1.0, Math.PI, Math.PI * 2); b.fill();
    if (P.cap) { b.fillStyle = shade(P.cap, -0.25); b.fillRect(q(hx - r * 1.2), q(hy - r * 0.2), q(r * 2.4), Math.max(px, q(r * 0.18))); }
    else { b.fillStyle = hr; b.fillRect(q(hx - r), q(hy - r * 0.2), q(r * 0.3), q(r * 0.6)); b.fillRect(q(hx + r * 0.7), q(hy - r * 0.2), q(r * 0.3), q(r * 0.6)); }
    const lk = W._look ? W._look.x * r * 0.38 : 0, lu = W._look ? W._look.up * r * 0.3 : 0;
    b.fillStyle = "#1b1b1f"; b.fillRect(q(hx - r * 0.45 + lk), q(hy + r * 0.1 - lu), px * 2, px * 2); b.fillRect(q(hx + r * 0.25 + lk), q(hy + r * 0.1 - lu), px * 2, px * 2);
    b.fillStyle = skinD; b.fillRect(q(hx - px * 0.5 + lk * 1.3), q(hy + r * 0.3 - lu), px, q(r * 0.25));
    b.fillStyle = "#a4574a"; b.fillRect(q(hx - r * 0.25 + lk), q(hy + r * 0.62 - lu), q(r * 0.5), px);
    sigHead(P, false, hx, hy, r, hr, hrD, hrL);
  }
}

/* =====================================================================
   PLAYER SPRITE (detailed, on the actor layer) + 3D RACKET
   Owners: Player Artist (looks), Animator (frames). Everything is sized from the sprite height h, so real heights show.
   ===================================================================== */
const HAIR = { sinner: ["#e0702a", "#a8461a", "#f7a35c"], alcaraz: ["#2a1c14", "#120b07", "#4d3626"] };   // base, shadow, highlight
const RACKET_LOOK = { sinner: { frame: "#1d1d22", accent: "#f2f2ef" }, alcaraz: { frame: "#1d1d22", accent: "#e2544a" } };
function shade(hex, amt) {                               // lighten (+) or darken (−) a #rrggbb colour
  const n = parseInt(hex.slice(1), 16), f = c => Math.max(0, Math.min(255, Math.round(c + (amt > 0 ? (255 - c) : c) * amt)));
  return "#" + [f(n >> 16), f((n >> 8) & 255), f(n & 255)].map(v => v.toString(16).padStart(2, "0")).join("");
}
const V3 = { norm: v => { const l = Math.hypot(v.x, v.y, v.z) || 1; return { x: v.x / l, y: v.y / l, z: v.z / l }; },
             lerp: (a, c, t) => ({ x: a.x + (c.x - a.x) * t, y: a.y + (c.y - a.y) * t, z: a.z + (c.z - a.z) * t }) };
const ease = t => { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); };

/* The racket is a real object in court space: grip point, shaft direction u, string-face normal n.
   Projected like the court, so its length, angle and how "open" the face looks are right from any camera:
   face-on = a full oval with strings, edge-on = a thin line. (ox, oy) shifts it with the body's bob/crouch. */
const RACKET = { len: 0.685, handle: 0.2, headL: 0.33, headW: 0.26 };
function drawRacket(grip, u, n, look, ox = 0, oy = 0) {
  const at = t => ({ x: grip.x + u.x * t, y: grip.y + u.y * t, z: grip.z + u.z * t });
  const pp = w => { const r = proj(w.x, w.y, w.z); return { x: r.x + ox, y: r.y + oy, s: r.s }; };
  const c = at(RACKET.len - RACKET.headL / 2), top = pp(at(RACKET.len)), bot = pp(at(RACKET.len - RACKET.headL)), hc = pp(c);
  const g0 = pp(at(-0.03)), g1 = pp(at(RACKET.handle)), s = hc.s;
  const camz = { x: CAM_X, y: -CAM_BACK, z: CAM_H }, vd = V3.norm({ x: c.x - camz.x, y: c.y - camz.y, z: c.z - camz.z });
  const open = Math.abs(n.x * vd.x + n.y * vd.y + n.z * vd.z);          // 1 = strings face the camera, 0 = edge-on
  const major = Math.max(1 / AS, Math.hypot(top.x - bot.x, top.y - bot.y) / 2);
  const minor = Math.max(0.6 / AS, RACKET.headW / 2 * s * open);
  const rot = Math.atan2(top.y - bot.y, top.x - bot.x), lw = Math.max(1 / AS, 0.024 * s);
  b.lineCap = "round";
  b.strokeStyle = "#2b2b31"; b.lineWidth = Math.max(1 / AS, 0.04 * s);  // grip (tape)
  b.beginPath(); b.moveTo(g0.x, g0.y); b.lineTo(g1.x, g1.y); b.stroke();
  b.fillStyle = look.accent; b.fillRect(q(g0.x) - 0.5 / AS, q(g0.y) - 0.5 / AS, 1 / AS, 1 / AS);   // butt cap
  const nx = Math.cos(rot + Math.PI / 2) * minor * 0.8, ny = Math.sin(rot + Math.PI / 2) * minor * 0.8;
  b.strokeStyle = look.frame; b.lineWidth = lw;                          // throat: the open V into the head
  b.beginPath(); b.moveTo(g1.x, g1.y); b.lineTo(bot.x + nx, bot.y + ny); b.moveTo(g1.x, g1.y); b.lineTo(bot.x - nx, bot.y - ny); b.stroke();
  b.save(); b.translate(hc.x, hc.y); b.rotate(rot);
  b.beginPath(); b.ellipse(0, 0, major, minor, 0, 0, Math.PI * 2);
  if (minor > 1.5 / AS) {                                                // strings: a pale bed with a cross-hatch
    b.fillStyle = "rgba(236,236,226,0.22)"; b.fill();
    b.save(); b.clip(); b.strokeStyle = "rgba(246,246,238,0.6)"; b.lineWidth = 1 / AS; b.beginPath();
    for (let k = -3; k <= 3; k++) { const yy = k * minor / 3.6; b.moveTo(-major, yy); b.lineTo(major, yy); }
    for (let k = -4; k <= 4; k++) { const xx = k * major / 4.6; b.moveTo(xx, -minor); b.lineTo(xx, minor); }
    b.stroke(); b.restore();
  }
  b.strokeStyle = look.frame; b.lineWidth = lw; b.beginPath(); b.ellipse(0, 0, major, minor, 0, 0, Math.PI * 2); b.stroke();
  b.strokeStyle = look.accent; b.lineWidth = Math.max(1 / AS, lw * 0.5);  // a painted accent along the top of the frame
  b.beginPath(); b.ellipse(0, 0, major, minor, 0, -0.55, 0.55); b.stroke();
  b.restore();
}

/* Where the racket is: ready position, backswing as the ball comes, contact, follow-through; forehand on the
   racket side, two-handed backhand on the other; overhead for a serve; SLICE high-back to low-front.
   In player space: dx = to their right, dy = forward (toward the net), z = height.
   Owners: Racket Coach (agents/racket-coach/) for the swing paths, Animator for the body.
   TIMING: the swing is keyed to the time until contact (ttc), so the racket meets the ball on the beat:
   unit turn ~1.1 s out, racket back by ~0.45 s, forward swing in the last ~0.2 s, contact, follow-through.
   Poses are joined by a Catmull-Rom spline (pose track), so a stroke is one flowing motion, not stop-start blends.
   SLICE CLOCK (seen from behind the player): the racket top starts at ~2 o'clock (high and back) and finishes
   at SLICE_END o'clock (low and in front), 10 → 8/7 on the backhand side; shoulders tilt with the swing. */
const SLICE_END = { sinner: 4, alcaraz: 5 };              // Sinner finishes higher and shorter, Alcaraz lower and longer
function poseTrack(keys, t) {                              // keys: [[time, pose], ...] sorted by time
  const n = keys.length;
  if (t <= keys[0][0]) return keys[0][1];
  if (t >= keys[n - 1][0]) return keys[n - 1][1];
  let k = 0; while (t > keys[k + 1][0]) k++;
  const u = (t - keys[k][0]) / (keys[k + 1][0] - keys[k][0]);
  const P = [keys[Math.max(0, k - 1)][1], keys[k][1], keys[k + 1][1], keys[Math.min(n - 1, k + 2)][1]];
  const cr = (a, b1, c, d) => 0.5 * (2 * b1 + (c - a) * u + (2 * a - 5 * b1 + 4 * c - d) * u * u + (3 * b1 - a - 3 * c + d) * u * u * u);
  const v = f => ({ x: cr(...P.map(p => p[f].x)), y: cr(...P.map(p => p[f].y)), z: cr(...P.map(p => p[f].z)) });
  const num = f => cr(...P.map(p => p[f] || 0));
  return { g: v("g"), u: V3.norm(v("u")), n: V3.norm(v("n")), tilt: num("tilt"), crouch: num("crouch"),
           throat: u < 0.5 ? P[1].throat : P[2].throat, slice: P[1].slice || P[2].slice };
}
function racketPose(i, p, ago = 0) {
  const R = PLAYERS[i].side === "near" ? 1 : -1;        // near player's right is +x and forward is +y; far is the mirror
  const W = (dx, dy, z) => ({ x: p.x + R * dx, y: p.y + R * dy, z });
  const D = (dx, dy, dz) => V3.norm({ x: R * dx, y: R * dy, z: dz });
  const clk = (c, fwd) => D(Math.sin(c * Math.PI / 6), fwd, Math.cos(c * Math.PI / 6));   // racket top pointing at c o'clock
  const hz = Math.max(0.45, Math.min(1.75, p.hitZ ?? 1.0));                              // contact height of the last ball
  const se = SLICE_END[PLAYERS[i].id] ?? 4.5;
  const POSE = {
    ready:  p.receiving
          ? { g: W(0.22, 0.42, 0.8), u: D(0.12, 0.62, 0.78), n: D(0.9, 0, -0.1), throat: true }   // return stance: racket out in front, head up, both hands on it
          : { g: W(0.40, 0.18, 0.96), u: D(0.34, 0.30, 0.89), n: D(0.6, -0.8, 0), throat: true },  // head up beside the right side, strings toward the back
    fhBack: { g: W(0.55, -0.15, 1.15), u: D(0.45, -0.55, 0.62), n: D(0, 1, 0.35) },
    fhLoop: { g: W(0.62, -0.25, 0.85), u: D(0.55, -0.70, -0.20), n: D(0, 1, 0.1) },                 // racket drops below the ball before the swing up
    fhHit:  { g: W(0.60, 0.40, hz), u: D(0.90, 0.45, 0.10), n: D(0, 1, 0) },
    fhEnd:  { g: W(-0.35, 0.15, 1.55), u: D(-0.35, -0.60, 0.72), n: D(0.7, 0, 0.3) },
    bhBack: { g: W(-0.50, -0.10, 1.15), u: D(-0.50, -0.55, 0.62), n: D(0, 1, 0.35) },
    bhLoop: { g: W(-0.58, -0.22, 0.85), u: D(-0.55, -0.70, -0.20), n: D(0, 1, 0.1) },
    bhHit:  { g: W(-0.55, 0.40, hz), u: D(-0.90, 0.45, 0.10), n: D(0, 1, 0) },
    bhEnd:  { g: W(0.35, 0.15, 1.55), u: D(0.35, -0.60, 0.72), n: D(-0.7, 0, 0.3) },
    // SLICE: open face (strings tilted up), high back → contact → low in front, shoulders tilting through it
    fsBack: { g: W(0.50, -0.20, 1.50), u: clk(2, -0.08), n: D(0, 0.55, 0.85), tilt: -0.06, crouch: 0.01, slice: true },
    fsHit:  { g: W(0.60, 0.40, hz), u: clk(3, 0.12), n: D(0, 0.6, 0.8), tilt: 0.025, crouch: 0.045, slice: true },
    fsEnd:  { g: W(0.30, 0.70, Math.max(0.55, hz - 0.35)), u: clk(se, 0.08), n: D(0, 0.3, 0.95), tilt: 0.07, crouch: 0.07, slice: true },
    bsBack: { g: W(-0.50, -0.20, 1.50), u: clk(10, -0.08), n: D(0, 0.55, 0.85), tilt: 0.06, crouch: 0.01, slice: true },
    bsHit:  { g: W(-0.60, 0.40, hz), u: clk(9, 0.12), n: D(0, 0.6, 0.8), tilt: -0.025, crouch: 0.045, slice: true },
    bsEnd:  { g: W(-0.30, 0.70, Math.max(0.55, hz - 0.35)), u: clk(12 - se, 0.08), n: D(0, 0.3, 0.95), tilt: -0.07, crouch: 0.07, slice: true },
    // SERVE: trophy (racket up behind), racket drop (head down the back), contact high, follow through across
    trophy: { g: W(0.40, -0.10, 1.50), u: D(0.25, -0.45, -0.55), n: D(1, 0, 0), tilt: -0.04 },
    drop:   { g: W(0.30, -0.20, 1.70), u: D(0.15, -0.35, -0.92), n: D(1, 0, 0), tilt: -0.05, crouch: 0.03 },
    srvHit: { g: W(0.15, 0.25, 2.30), u: D(0.05, 0.25, 0.97), n: D(0, 1, 0.1), tilt: -0.02 },
    srvEnd: { g: W(-0.30, 0.25, 0.85), u: D(-0.35, -0.20, -0.90), n: D(0.8, 0, 0.2), tilt: 0.03, crouch: 0.05 },
  };
  const out = (pose, twoHands) => ({ ...pose, twoHands, throat: !twoHands && !!pose.throat });
  const tt = (rally ? clock - (p.hitT ?? -9) : 9) - ago, fh = (p.strokeSide || 1) > 0;
  if (rally && rally.serve && S.server === i && !rally.serve.captured) {          // serve routine: bounce, toss, trophy, drop, hit
    const k = (rally.serve.t - ago - ROUTINE.seconds) / ROUTINE.toss;
    return out(poseTrack([[0, POSE.ready], [0.55, POSE.trophy], [0.86, POSE.drop], [1, POSE.srvHit]], k), false);
  }
  if (p.hitServe && tt >= 0 && tt < 0.8)                                          // serve: contact up high, follow through down across
    return out(poseTrack([[0, POSE.srvHit], [0.3, POSE.srvEnd], [0.8, POSE.ready]], tt), false);
  if (p.strokeType === "slice" && tt >= 0 && tt < 1.0)                            // slice: one long readable sweep, held a moment
    return out(poseTrack(fh ? [[0, POSE.fsHit], [0.36, POSE.fsEnd], [0.52, POSE.fsEnd], [1.0, POSE.ready]]
                            : [[0, POSE.bsHit], [0.36, POSE.bsEnd], [0.52, POSE.bsEnd], [1.0, POSE.ready]], tt), false);
  const [H, E] = fh ? [POSE.fhHit, POSE.fhEnd] : [POSE.bhHit, POSE.bhEnd];
  if (tt >= 0 && tt < 0.8)                                                        // just hit: contact → follow-through → back to ready
    return out(poseTrack([[0, H], [0.26, E], [0.8, POSE.ready]], tt), !fh);
  const sh = rally && rally.shot;
  if (sh && sh.recv === i && !rally.serve && ball) {                              // the ball is coming: swing on the beat of its arrival
    const ttc = sh.t1 + 0.85 * sh.t2 - sh.t + ago;                                // ≈ time left until contact
    const side = (sh.end.x - p.x) * R >= 0;                                       // forehand if it comes to the racket side
    const slice = i === 0 ? (input.keys.has("e") || input.slice) : !!p.planSlice; // you hold E; the computer decided early
    const zc = Math.max(0.45, Math.min(1.75, sh.end.z));
    const set = (pz) => ({ ...pz, g: { ...pz.g, z: zc } });                       // aim the contact pose at the ball's height
    const keys = slice
      ? (side ? [[-1.1, POSE.ready], [-0.45, POSE.fsBack], [-0.2, POSE.fsBack], [0, set(POSE.fsHit)]]
              : [[-1.1, POSE.ready], [-0.45, POSE.bsBack], [-0.2, POSE.bsBack], [0, set(POSE.bsHit)]])
      : (side ? [[-1.1, POSE.ready], [-0.45, POSE.fhBack], [-0.18, POSE.fhLoop], [0, set(POSE.fhHit)]]
              : [[-1.1, POSE.ready], [-0.45, POSE.bhBack], [-0.18, POSE.bhLoop], [0, set(POSE.bhHit)]]);
    return out(poseTrack(keys, -Math.max(-0.02, ttc)), !side && !slice);
  }
  return out(POSE.ready, false);
}

/* SIGNATURE LOOKS (Appearance Scout → datasets/players/<id>/appearance.json; Ryan's calls for Sinner and Alcaraz).
   The one feature that makes each pro recognisable, exaggerated so it reads even on a small pixel sprite.
   "cap-curls" (Sinner): an oversized cap, bright ginger curls flaring out at the sides and the nape.
   "long-band" (Alcaraz): long outgrown hair puffing up over a white hairband and falling to the neck; a full beard. */
function drawSignature(P, near, H) {
  const L = P.look; if (!L) return;
  const { hx0, hy0, hw, hh, tx, turn, hair, hairD, hairL, skin, Rr, strands } = H, px = 1 / AS;
  if (L.style === "cap-curls") {
    const cap = P.cap || "#f2f2ef";
    for (const sd of [-1, 1]) for (let k = 0; k < 4; k++) {                                  // curls flaring out under the cap, both sides
      const x = sd < 0 ? hx0 - hw * (0.16 + 0.05 * (k % 2)) : hx0 + hw + hw * (0.04 - 0.05 * (k % 2)), y = hy0 + hh * (0.3 + k * 0.15);
      Rr(x, y, hw * 0.14, hh * 0.13, k % 2 ? hairL : hair); Rr(x + (sd < 0 ? 0 : hw * 0.06), y + hh * 0.08, hw * 0.08, hh * 0.06, hairD);
    }
    if (near) for (let k = 0; k < 6; k++)                                                    // a thick curly nape
      Rr(hx0 + hw * (k / 5) - hw * 0.08, hy0 + hh * (0.86 + 0.06 * (k % 2)), hw * 0.16, hh * 0.16, k % 2 ? hair : hairL);
    Rr(hx0 - hw * 0.08, hy0 - hh * 0.16, hw * 1.16, hh * (near ? 0.6 : 0.54), cap);          // oversized crown
    Rr(hx0 - hw * 0.08, hy0 - hh * 0.16, hw * 0.22, hh * (near ? 0.6 : 0.54), shade(cap, -0.12));
    Rr(tx - px * 0.5, hy0 - hh * 0.16, px, hh * 0.5, shade(cap, -0.22));                     // seam
    Rr(tx - px, hy0 - hh * 0.2, px * 2, px * 2, shade(cap, -0.3));                           // button on top
    if (near) { Rr(tx - hw * 0.24, hy0 + hh * 0.34, hw * 0.48, hh * 0.06, shade(cap, -0.3)); Rr(tx - hw * 0.14, hy0 + hh * 0.4, hw * 0.28, hh * 0.08, hairD); }   // strap
    else { Rr(hx0 - hw * 0.32 + turn * hw * 0.2, hy0 + hh * 0.34, hw * 1.64, hh * 0.12, shade(cap, -0.2));   // a long brim, pointing at you
           Rr(hx0 - hw * 0.1, hy0 + hh * 0.46, hw * 1.2, px, shade(skin, -0.25)); }        // its shadow on the forehead
  }
  if (L.style === "long-band") {
    const band = L.band || "#f6f6f2";
    strands(hx0 - hw * 0.12, hy0 - hh * 0.3, hw * 1.24, hh * 0.42);                          // volume: hair puffing up over the band
    if (near) {
      strands(hx0 - hw * 0.14, hy0 + hh * 0.05, hw * 1.28, hh * 1.05);                       // the back of the head: long hair down to the neck
      for (let k = 0; k < 7; k++) Rr(hx0 - hw * 0.14 + hw * 1.28 * k / 6 - px, hy0 + hh * 1.05, px * 3, hh * (0.12 + 0.1 * ((k * 3) % 4) / 3), k % 2 ? hairD : hair);   // wavy ends
    } else {                                                                                  // front: hair framing the face to the jaw, a full beard
      strands(hx0 - hw * 0.2, hy0 + hh * 0.05, hw * 0.26, hh * 0.95); strands(hx0 + hw * 0.94, hy0 + hh * 0.05, hw * 0.26, hh * 0.95);
      if (L.beard) {
        const fo = turn * hw * 0.22;
        Rr(hx0 + fo, hy0 + hh * 0.62, hw, hh * 0.4, hairD);                                  // beard: cheeks, jaw and chin
        Rr(hx0 + fo, hy0 + hh * 0.5, hw * 0.12, hh * 0.2, hairD); Rr(hx0 + hw * 0.88 + fo, hy0 + hh * 0.5, hw * 0.12, hh * 0.2, hairD);   // sideburns
        Rr(tx - hw * 0.2 + fo, hy0 + hh * 0.7, hw * 0.4, px, hairD);                          // moustache
        Rr(tx - hw * 0.12 + fo, hy0 + hh * 0.8, hw * 0.24, px, "#b8695a");                    // mouth through the beard
        Rr(hx0 + hw * 0.1 + fo, hy0 + hh * 0.72, px, px, hairL); Rr(hx0 + hw * 0.8 + fo, hy0 + hh * 0.84, px, px, hairL);   // a little texture
      }
    }
    Rr(hx0 - hw * 0.14, hy0 + hh * 0.06, hw * 1.28, hh * 0.14, band);                        // the hairband, right round the head
    Rr(hx0 - hw * 0.14, hy0 + hh * 0.17, hw * 1.28, px, shade(band, -0.25));
  }
}

function drawPlayer(i, pos, swing) {
  if (pos.motion && pos.motion.world) return drawCapturedFigure(i, pos, pos.motion.world);
  const P = PLAYERS[i], near = P.side === "near", R = near ? 1 : -1;
  const g = proj(pos.x, pos.y), s = g.s;
  const h = Math.max(6, P.heightM * s), w = h * 0.30, skin = "#e1b48b", skinD = shade(skin, -0.18), skinL = shade(skin, 0.12);
  const A = window.Anim ? Anim.frame(pos, BODY[i], near, P.id)
    : { bob: 0, lean: 0, crouch: 0.02, turn: 0, feet: [{ dx: -0.26, dy: 0, lift: 0 }, { dx: 0.26, dy: 0, lift: 0 }], knees: [{ dx: 0, dy: 0 }, { dx: 0, dy: 0 }], arms: [0, 0] };
  const turn = A.turn || 0, DEP = 0.42;                    // depth → screen height
  const look = RACKET_LOOK[P.id] || RACKET_LOOK.sinner;
  const rp = racketPose(i, pos);
  /* YAW: how far the body is turned (−1…1, screen sense: + = toward screen right). Running sideways turns the whole
     body (turn); taking the racket back turns the shoulders (the unit turn), so a swing reads as a rotation too.
     Turned sideways = narrower, and the seams, logo and shading slide round the body (see cyl below). */
  const dxR = (rp.g.x - pos.x) * R, dyR = (rp.g.y - pos.y) * R;
  const twistS = Math.max(0, Math.min(1, -dyR * 2.6)) * Math.sign(dxR) * 0.8 * R;
  const yaw = Math.max(-1, Math.min(1, turn + twistS * (1 - Math.abs(turn)))), tw = 1 - 0.36 * Math.abs(yaw);
  const hop = pos.air > 0 ? h * 0.07 : 0, drop = (A.crouch + (rp.crouch || 0) - A.bob) * h;
  const tiltR = (rp.tilt || 0) * h;                         // + = racket shoulder lower (a slice finishing low), − = higher
  const x = g.x, y = g.y - hop, lx = A.lean * h, tx = x + lx;
  const Rr = (rx, ry, rw, rh, c) => { b.fillStyle = c; b.fillRect(q(rx), q(ry), Math.max(1 / AS, q(rw)), Math.max(1 / AS, q(rh))); };
  const Ln = (x1, y1, x2, y2, c, lw) => { b.strokeStyle = c; b.lineWidth = Math.max(1 / AS, lw); b.lineCap = "round";
    b.beginPath(); b.moveTo(q(x1), q(y1)); b.lineTo(q(x2), q(y2)); b.stroke(); };
  const behind = rp.g.y + rp.u.y * RACKET.len * 0.7 > pos.y + 0.05;   // head farther than the body?
  const gs = proj(rp.g.x, rp.g.y, rp.g.z), grip = { x: gs.x + lx * 0.5, y: gs.y - hop + drop };

  if (behind) drawRacket(rp.g, rp.u, rp.n, look, lx * 0.5, -hop + drop);

  const hipY = y - h * 0.5 + drop;
  const lit = litLeft() ? -1 : 1;                          // which screen side faces the sun / main light
  const Lr = (x1, y1, x2, y2, c, lw) => {                  // a ROUND limb: shaded edge, base colour, highlight toward the light
    const o = lit * lw * 0.17;
    Ln(x1, y1, x2, y2, shade(c, -0.24), lw); Ln(x1 + o, y1, x2 + o, y2, c, lw * 0.62); Ln(x1 + o * 2.3, y1, x2 + o * 2.3, y2, shade(c, 0.16), lw * 0.22);
  };
  /* CYLINDER: fill the current path with vertical shading bands, lit on the light side and dark round the far edge,
     like a real round body under one light. mark(beta) = where a line drawn on the body at angle beta (0 = the middle
     of the back from behind / of the chest from the front) shows on screen as the body turns, or null when it has
     gone round the far side. */
  const yawA = yaw * Math.PI / 2 * 0.85, ys = near ? -1 : 1;
  const cyl = (x0, x1, y0, y1, col) => {
    b.save(); b.clip(); const NB = 8, bw = (x1 - x0) / NB;
    for (let k = 0; k < NB; k++) {
      const th = Math.asin(-1 + (2 * k + 1) / NB), Lt = 0.6 * Math.cos(th) + 0.5 * lit * Math.sin(th);
      b.fillStyle = shade(col, -0.27 + 0.36 * Math.max(0, (Lt + 0.45) / 1.45)); b.fillRect(x0 + k * bw, y0, bw + 1 / AS, y1 - y0);
    }
    b.restore();
  };
  const mark = (beta, half) => { const th = beta + ys * yawA; return Math.cos(th) > 0.12 ? tx + Math.sin(th) * half : null; };
  const mixHex = (a, c, t) => { const A = parseInt(a.slice(1), 16), C = parseInt(c.slice(1), 16), m = sh => Math.round(((A >> sh) & 255) * (1 - t) + ((C >> sh) & 255) * t);
    return "#" + [16, 8, 0].map(sh => m(sh).toString(16).padStart(2, "0")).join(""); };
  // LEGS: thigh and shin (lit and shaded sides), white socks, shoes with a sole and an accent stripe
  const legOrder = [0, 1].sort((a, c) => (A.feet[c].dy || 0) - (A.feet[a].dy || 0));   // the farther leg first
  for (const k of legOrder) {
    const side = k ? 1 : -1, f = A.feet[k], kn = (A.knees || [])[k] || { dx: 0, dy: 0 };
    const hx = x + side * w * 0.2 * tw + lx * 0.3, fx = x + f.dx * w + lx * 0.1, fy = y - f.lift * h - (f.dy || 0) * h * DEP;
    const kx = (hx + fx) / 2 + side * w * 0.06 * tw + kn.dx * w, ky = (hipY + fy) / 2 - f.lift * h * 0.6 - kn.dy * h * DEP * 1.6;
    Lr(hx, hipY, kx, ky, skin, w * 0.29); Lr(kx, ky, fx, fy - h * 0.06, skin, w * 0.23);    // thigh and shin, round
    Ln(fx, fy - h * 0.085, fx, fy - h * 0.05, P.socks || "#f1f1ee", w * 0.21);              // sock
    Rr(fx - w * 0.19, fy - h * 0.058, w * 0.38, h * 0.045, P.shoes || "#f2f2f2");            // shoe upper
    Rr(fx - w * 0.2, fy - h * 0.016, w * 0.4, h * 0.016, shade(P.shoes || "#f2f2f2", -0.45)); // sole
    Rr(fx - w * 0.12, fy - h * 0.04, w * 0.22, 1 / AS, P.ui || "#d23a3a");                   // accent stripe
    const sc = P.shoes || "#f2f2f2";
    if ((f.sole || 0) > 0.35) {                                                             // HEEL KICK seen from behind: the sole faces you
      Rr(fx - w * 0.17, fy - h * 0.075, w * 0.34, h * 0.07, shade(sc, -0.5));
      Rr(fx - w * 0.12, fy - h * 0.06, w * 0.24, h * 0.012, shade(sc, -0.25));               // tread
      Rr(fx - w * 0.12, fy - h * 0.035, w * 0.24, h * 0.012, shade(sc, -0.25));
    } else if (near) {                                                                              // from behind: the heel counter and pull tab
      Rr(fx - w * 0.1, fy - h * 0.058, w * 0.2, h * 0.034, shade(sc, -0.35));
      Rr(fx - w * 0.04, fy - h * 0.066, w * 0.08, h * 0.012, P.ui || "#d23a3a");
      Rr(kx - w * 0.07, ky + h * 0.01, w * 0.14, 1 / AS, skinD);                            // the crease behind the knee
    } else {                                                                                 // from the front: laces, a toe cap, kneecaps
      Rr(fx - w * 0.07, fy - h * 0.058, w * 0.14, h * 0.026, "#ffffff");
      for (let r = 0; r < 3; r++) Rr(fx - w * 0.07, fy - h * 0.055 + r * h * 0.009, w * 0.14, 1 / AS, shade(sc, -0.4));
      Rr(fx - w * 0.17, fy - h * 0.03, w * 0.34, h * 0.014, shade(sc, -0.12));
      Rr(kx - w * 0.05, ky - h * 0.012, w * 0.1, h * 0.022, skinL);
    }
  }
  const shY = hipY - h * (0.36 - (A.bend || 0)), shirt = P.shirt;          // bend: tipped forward, shoulders lower
  // ARMS: sleeve, upper arm, forearm, wristband, hand. Racket arm reaches the grip; the other swings (or joins a backhand).
  const arm = (sx, sy, hx2, hy2, out, sleeve) => {
    const ex = (sx + hx2) / 2 + out * w * 0.18, ey = (sy + hy2) / 2 + h * 0.02;
    Lr(sx, sy, ex, ey, skin, w * 0.21); Lr(ex, ey, hx2, hy2, sleeve || skin, w * 0.18);         // forearm (or a compression sleeve over it)
    Lr(sx, sy, sx + (ex - sx) * 0.45, sy + (ey - sy) * 0.45, shirt, w * 0.28);              // short sleeve
    Ln(hx2 + (ex - hx2) * 0.22, hy2 + (ey - hy2) * 0.22, hx2 + (ex - hx2) * 0.08, hy2 + (ey - hy2) * 0.08, P.ui || "#f2f2f2", w * 0.2);  // wristband
    Rr(hx2 - w * 0.08, hy2 - w * 0.08, w * 0.16, w * 0.16, skinL);                           // hand
  };
  const rS = { x: tx + R * w * 0.5 * tw, y: shY + h * 0.05 + tiltR }, lS = { x: tx - R * w * 0.5 * tw, y: shY + h * 0.05 - tiltR };
  const swingDir = A.dir === "right" ? 1 : A.dir === "left" ? -1 : 0, swingUp = A.dir === "away" ? 1 : A.dir === "toward" ? -1 : 0;
  let freeHand = { x: lS.x - R * w * 0.25 * tw + swingDir * A.arms[0] * w * 0.55,           // the free arm pumps with the legs
                   y: shY + h * 0.33 + A.arms[0] * h * 0.05 - swingUp * A.arms[0] * h * 0.035 - Math.abs(swingDir * A.arms[0]) * h * 0.04 };
  let freeOnThroat = false;
  if (rp.twoHands) freeHand = { x: grip.x, y: grip.y + h * 0.02 };
  else if (rp.throat && A.kind !== "run" && A.kind !== "backpedal") {   // ready: the other hand cradles the racket's throat
    const t = RACKET.handle + 0.06, th = proj(rp.g.x + rp.u.x * t, rp.g.y + rp.u.y * t, rp.g.z + rp.u.z * t);
    freeHand = { x: th.x + lx * 0.5, y: th.y - hop + drop }; freeOnThroat = true;
  }
  /* DEPTH: a hand in front of the body is hidden by the torso when he's seen from behind, and drawn over the torso
     when he faces you; a hand behind the body is the other way round. So from behind you see his back and the
     arms at his sides, never an arm painted across his back. */
  // an arm that reaches across the body's middle always passes in front of the chest (shoulders can't cross behind the back)
  const crosses = (S0, hand) => Math.sign(hand.x - tx) !== Math.sign(S0.x - tx) && Math.abs(hand.x - tx) > w * 0.08;
  const racketFront = (rp.g.y - pos.y) * R > 0.02 || crosses(rS, grip);
  const freeFront = rp.twoHands || freeOnThroat ? racketFront || crosses(lS, freeHand)
                  : crosses(lS, freeHand) || ((A.kind === "run" || A.kind === "backpedal") && A.arms[0] > 0.2);
  const stub = (S0, hx2, hy2, out, k) => {                   // the top of a hidden arm still shows at the shoulder
    const ex = (S0.x + hx2) / 2 + out * w * 0.18, ey = (S0.y + hy2) / 2 + h * 0.02;
    Ln(S0.x, S0.y, S0.x + (ex - S0.x) * k, S0.y + (ey - S0.y) * k, skin, w * 0.2);
    Ln(S0.x, S0.y, S0.x + (ex - S0.x) * 0.45, S0.y + (ey - S0.y) * 0.45, shirt, w * 0.26);
  };
  const drawArms = (front) => {
    const freeHidden = near ? freeFront : !freeFront, racketHidden = near ? racketFront : !racketFront;
    if (freeHidden !== front) arm(lS.x, lS.y, freeHand.x, freeHand.y, -R);
    else if (front && near) stub(lS, freeHand.x, freeHand.y, -R, 0.6);
    if (racketHidden !== front) arm(rS.x, rS.y, grip.x, grip.y, R, P.sleeve);
    else if (front && near) stub(rS, grip.x, grip.y, R, 0.6);
  };
  drawArms(false);                                                                           // arms hidden behind the torso first
  b.save(); b.translate(q(tx), 0); b.scale(tw, 1); b.translate(-q(tx), 0);               // turned sideways: the torso narrows
  // SHORTS: round (cylinder shading), a waistband, the split between the legs and a side seam that turn with the hips
  b.beginPath(); b.moveTo(q(tx - w * 0.45), q(hipY - h * 0.06)); b.lineTo(q(tx + w * 0.45), q(hipY - h * 0.06));
  b.lineTo(q(tx + w * 0.47), q(hipY + h * 0.1)); b.lineTo(q(tx - w * 0.47), q(hipY + h * 0.1)); b.closePath();
  cyl(tx - w * 0.47, tx + w * 0.47, hipY - h * 0.06, hipY + h * 0.1, P.shorts);
  Rr(tx - w * 0.45, hipY - h * 0.06, w * 0.9, h * 0.022, shade(P.shorts, -0.24));
  { const m0 = mark(0, w * 0.45); if (m0 != null) Rr(m0 - 0.5 / AS, hipY + h * 0.045, 1 / AS, h * 0.055, shade(P.shorts, -0.34)); }   // the split
  for (const sd of [-1, 1]) { const ms = mark(sd * Math.PI / 2 * 0.92, w * 0.46); if (ms != null) Rr(ms - 0.5 / AS, hipY - h * 0.04, 1 / AS, h * 0.13, shade(P.shorts, -0.3)); }   // side seams
  // JERSEY: broad round shoulders narrowing to the waist, shaded like a cylinder; the collar, spine seam, side seams and
  // chest logo sit on the body, so they slide round as he turns
  const tR = R > 0 ? tiltR : -tiltR;                        // tilt seen on screen: right corner down by tR, left corner up
  b.beginPath();
  b.moveTo(q(tx - w * 0.52), q(shY + h * 0.0 - tR)); b.quadraticCurveTo(q(tx), q(shY - h * 0.025), q(tx + w * 0.52), q(shY + h * 0.0 + tR));
  b.quadraticCurveTo(q(tx + w * 0.6), q(shY + h * 0.03 + tR), q(tx + w * 0.54), q(shY + h * 0.09 + tR * 0.7));
  b.lineTo(q(tx + w * 0.46), q(hipY - h * 0.03)); b.lineTo(q(tx - w * 0.46), q(hipY - h * 0.03));
  b.lineTo(q(tx - w * 0.54), q(shY + h * 0.09 - tR * 0.7)); b.quadraticCurveTo(q(tx - w * 0.6), q(shY + h * 0.03 - tR), q(tx - w * 0.52), q(shY - tR));
  b.closePath();
  cyl(tx - w * 0.6, tx + w * 0.6, shY - h * 0.03 - Math.abs(tR), hipY, shirt);
  if (P.shirtLow) for (let k = 1; k <= 4; k++) {                                              // a fade: dark at the shoulders, light at the waist
    b.globalAlpha = 0.75; Rr(tx - w * (0.53 - k * 0.018), shY + h * (0.04 + k * 0.064), w * (1.06 - k * 0.036), h * 0.066, mixHex(shirt, P.shirtLow, k / 4)); b.globalAlpha = 1; }
  Rr(tx - w * 0.46, hipY - h * 0.06, w * 0.92, h * 0.025, shade(P.shirtLow || shirt, -0.1));   // hem
  for (const sd of [-1, 1]) { const ms = mark(sd * Math.PI / 2 * 0.9, w * 0.5); if (ms != null) Rr(ms - 0.5 / AS, shY + h * 0.08, 1 / AS, h * 0.22, shade(shirt, -0.26)); }   // side seams
  const m0 = mark(0, w * 0.5);
  if (near) {                                                                                // BACK of the jersey: a spine seam, collar, shoulder blades
    if (m0 != null) { Rr(m0 - w * 0.14, shY, w * 0.28, h * 0.025, shade(shirt, -0.28)); Rr(m0 - 0.5 / AS, shY + h * 0.03, 1 / AS, h * 0.27, shade(shirt, -0.2)); }
    for (const sd of [-1, 1]) { const mb = mark(sd * 0.55, w * 0.5); if (mb != null) Rr(mb - w * 0.12, shY + h * 0.07, w * 0.24, h * 0.012, shade(shirt, -0.12)); }   // shoulder-blade folds
  } else if (m0 != null) {                                                                   // FRONT: V-neck, placket, buttons, chest logo
    Ln(m0 - w * 0.12, shY, m0, shY + h * 0.05, shade(shirt, -0.3), 1 / AS); Ln(m0 + w * 0.12, shY, m0, shY + h * 0.05, shade(shirt, -0.3), 1 / AS);
    Rr(m0 - w * 0.07, shY, w * 0.14, h * 0.035, skin);
    Rr(m0 - 0.5 / AS, shY + h * 0.035, 1 / AS, h * 0.07, shade(shirt, -0.3));
    Rr(m0 + 1 / AS, shY + h * 0.05, 1 / AS, 1 / AS, "#f4f4ef"); Rr(m0 + 1 / AS, shY + h * 0.085, 1 / AS, 1 / AS, "#f4f4ef");
    const ml = mark(-R * 0.48, w * 0.5); if (ml != null) Rr(ml - w * 0.05, shY + h * 0.08, w * 0.1, h * 0.03, shade(shirt, shirt === "#f4f4f0" ? -0.25 : 0.55));   // chest logo
  }
  b.restore();
  drawArms(true);                                                                            // then the ones in front of it
  // HEAD: neck, ears, hair with strands (or cap with seams and the hair showing under it); face from the front
  const hw = w * 0.56 * (1 - 0.15 * Math.abs(turn)), hh = h * 0.15, hx0 = tx - hw / 2 + tR * 0.6 + turn * w * 0.06, hy0 = shY - hh - h * 0.015 + Math.abs(tiltR) * 0.3;
  const [hair, hairD, hairL] = HAIR[P.id] || [P.hair, shade(P.hair, -0.35), shade(P.hair, 0.25)];
  Rr(tx - w * 0.12, shY - h * 0.03, w * 0.24, h * 0.04, skinD);                              // neck
  Rr(hx0, hy0, hw, hh, skin);                                                                // head
  Rr(lit > 0 ? hx0 : hx0 + hw * 0.74, hy0 + hh * 0.08, hw * 0.26, hh * 0.86, skinD);         // round: the side away from the light in shade
  Rr(hx0 - 1 / AS, hy0 + hh * 0.4, 1 / AS, hh * 0.25, skinD); Rr(hx0 + hw, hy0 + hh * 0.4, 1 / AS, hh * 0.25, skinD);   // ears
  const strands = (x0, y0, ww, hh2) => {                                                     // hair texture: base, shadow, highlights
    Rr(x0, y0, ww, hh2, hair);
    const step = 1 / AS;
    for (let yy = 0; yy < hh2; yy += step) for (let xx = 0; xx < ww; xx += step) {
      const v = (Math.sin((xx * 7.3 + yy * 3.1) * AS) + Math.sin((xx * 2.7 - yy * 5.9) * AS)) * 0.5;
      if (v > 0.78) Rr(x0 + xx, y0 + yy, step, step, hairL); else if (v < -0.72) Rr(x0 + xx, y0 + yy, step, step, hairD);
    }
  };
  if (near) {                                                                                // seen from behind
    if (P.cap) {
      strands(hx0 - 1 / AS, hy0 + hh * 0.42, hw + 2 / AS, hh * 0.5);                        // hair covers the whole back of the head under the cap
      for (let k = 0; k < 7; k++) {                                                          // curls: an uneven edge at the nape and sides
        const cx = hx0 - 1 / AS + (hw + 2 / AS) * k / 6, len = hh * (0.1 + 0.12 * ((k * 37) % 5) / 4);
        Rr(cx - 0.5 / AS, hy0 + hh * 0.88, 1.5 / AS, len, k % 2 ? hair : hairD);
      }
      Rr(hx0, hy0 - hh * 0.04, hw, hh * 0.55, P.cap);                                        // cap crown
      Rr(hx0, hy0 - hh * 0.04, hw * 0.2, hh * 0.55, shade(P.cap, -0.12));                    // crown shading
      Rr(tx - 0.5 / AS, hy0 - hh * 0.04, 1 / AS, hh * 0.55, shade(P.cap, -0.22));            // centre seam
      Rr(tx - hw * 0.18, hy0 + hh * 0.42, hw * 0.36, hh * 0.1, hairD);                       // the strap opening, hair through it
      Rr(tx - hw * 0.22, hy0 + hh * 0.36, hw * 0.44, hh * 0.05, shade(P.cap, -0.3));         // strap
    } else {                                                                                 // a full head of hair: crown, shadow at the edge, a ragged nape
      strands(hx0, hy0 - hh * 0.06, hw, hh * 0.98);
      Rr(hx0, hy0 - hh * 0.06, 1 / AS, hh * 0.82, hairD); Rr(hx0 + hw - 1 / AS, hy0 - hh * 0.06, 1 / AS, hh * 0.82, hairD);
      for (let k = 0; k < 6; k++) Rr(hx0 + hw * k / 5 - 0.5 / AS, hy0 + hh * 0.86, 1.5 / AS, hh * (0.08 + 0.06 * (k % 3)), hairD);
    }
    if (Math.abs(turn) > 0.5) {
      const sd = Math.sign(turn);
      Rr(sd > 0 ? hx0 + hw - 2 / AS : hx0, hy0 + hh * 0.42, 2 / AS, hh * 0.42, skin);       // cheek edge
      Rr(sd > 0 ? hx0 + hw : hx0 - 1 / AS, hy0 + hh * 0.56, 1 / AS, hh * 0.12, skin);        // nose tip
    }
  } else {                                                                                   // seen from the front: a face
    if (P.cap) { Rr(hx0, hy0 - hh * 0.04, hw, hh * 0.4, P.cap); Rr(hx0 - hw * 0.1, hy0 + hh * 0.3, hw * 1.2, hh * 0.08, shade(P.cap, -0.25)); }   // cap + brim
    else { strands(hx0, hy0 - hh * 0.06, hw, hh * 0.38); Rr(hx0, hy0 + hh * 0.25, hw * 0.18, hh * 0.3, hair); Rr(hx0 + hw * 0.82, hy0 + hh * 0.25, hw * 0.18, hh * 0.3, hair); }
    const px = 1 / AS, eyeY = hy0 + hh * 0.5;
    const fo = turn * hw * 0.22; b.save(); b.translate(q(fo), 0);                        // turning: the face slides toward where they run
    if (P.cap) Rr(hx0, hy0 + hh * 0.38, hw, hh * 0.08, skinD);                               // shadow under the brim
    Rr(tx - hw * 0.34, eyeY - hh * 0.12, hw * 0.24, px, hairD); Rr(tx + hw * 0.1, eyeY - hh * 0.12, hw * 0.24, px, hairD);   // eyebrows
    Rr(tx - hw * 0.32, eyeY, hw * 0.2, px * 2, "#f4f1ea"); Rr(tx + hw * 0.12, eyeY, hw * 0.2, px * 2, "#f4f1ea");           // whites of the eyes
    Rr(tx - hw * 0.24, eyeY, px * 2, px * 2, "#1b1b1f"); Rr(tx + hw * 0.2, eyeY, px * 2, px * 2, "#1b1b1f");                 // pupils
    Rr(tx - px * 0.5, eyeY + hh * 0.08, px, hh * 0.16, skinD); Rr(tx - px * 0.5, eyeY + hh * 0.24, px * 2, px, skinD);     // nose
    Rr(tx - hw * 0.14, hy0 + hh * 0.8, hw * 0.28, px, "#a4574a");                             // mouth

    b.restore();

  if (!behind) drawRacket(rp.g, rp.u, rp.n, look, lx * 0.5, -hop + drop);
  if (rp.slice && !matchMedia("(prefers-reduced-motion: reduce)").matches) {   // SLICE TRAIL: the head's path, so the high-to-low sweep reads
    for (let k = 1; k <= 5; k++) {
      const o = racketPose(i, pos, k * 0.035), hd = proj(o.g.x + o.u.x * (RACKET.len - 0.16), o.g.y + o.u.y * (RACKET.len - 0.16), o.g.z + o.u.z * (RACKET.len - 0.16));
      b.fillStyle = `rgba(236,240,226,${0.42 - k * 0.07})`; const r = Math.max(1 / AS, 0.05 * s);
      b.fillRect(q(hd.x + lx * 0.5 - r), q(hd.y - hop + drop - r), q(r * 2) || 1 / AS, q(r * 2) || 1 / AS);
    }
  }
}

/* THE BALL: round, optic yellow felt, lit from the light side and shaded on the other, a white seam that turns
   with its spin, a fuzzy edge, and a faint trail when it flies fast. (Its shadow is drawn by drawShadows.) */
const BALL_R = 0.1;                                      // drawn radius in metres: ~3× real, so it reads at any distance
function drawBall(ball, inset = false) {
  const p = proj(ball.x, ball.y, ball.z), r = Math.min(9, Math.max(2.2, BALL_R * p.s)), cx = q(p.x), cy = q(p.y);
  const tr = ball._trail || (ball._trail = []);
  const sp = tr.length ? Math.hypot(ball.x - tr[0].x, ball.y - tr[0].y, ball.z - tr[0].z) : 0;
  if (sp > 0.12 && !matchMedia("(prefers-reduced-motion: reduce)").matches)      // moving fast: a short fading trail
    tr.slice(0, 3).forEach((o, k) => { const t = proj(o.x, o.y, o.z);
      b.fillStyle = `rgba(216,238,76,${0.22 - k * 0.06})`; b.beginPath(); b.arc(q(t.x), q(t.y), r * (0.9 - k * 0.15), 0, Math.PI * 2); b.fill(); });
  if (!inset) { tr.unshift({ x: ball.x, y: ball.y, z: ball.z }); tr.length = Math.min(tr.length, 4); }
  const lx = litLeft() ? -1 : 1, night = !LIGHT().sun;
  b.save(); b.beginPath(); b.arc(cx, cy, r, 0, Math.PI * 2); b.clip();
  b.fillStyle = "#a9c02c"; b.fillRect(cx - r, cy - r, r * 2, r * 2);                         // shaded side
  b.fillStyle = "#d6ec3e"; b.beginPath(); b.arc(cx + lx * r * 0.28, cy - r * 0.24, r * 0.95, 0, Math.PI * 2); b.fill();   // lit felt
  b.fillStyle = "#f2fb9a"; b.beginPath(); b.arc(cx + lx * r * 0.42, cy - r * 0.42, r * (night ? 0.24 : 0.32), 0, Math.PI * 2); b.fill();   // highlight
  const th = (clock || gameT) * 11 + ball.x;                                               // the seam turns with the spin
  b.strokeStyle = "rgba(250,250,238,0.95)"; b.lineWidth = Math.max(1 / AS, r * 0.16);
  b.beginPath(); b.ellipse(cx - Math.cos(th) * r * 0.55, cy - Math.sin(th) * r * 0.55, r * 0.75, r * 0.5, th, -1.1, 1.1); b.stroke();
  b.beginPath(); b.ellipse(cx + Math.cos(th) * r * 0.55, cy + Math.sin(th) * r * 0.55, r * 0.75, r * 0.5, th + Math.PI, -1.1, 1.1); b.stroke();
  b.restore();
  b.fillStyle = "rgba(226,244,120,0.55)";                                                  // felt fuzz around the edge
  for (let k = 0; k < 10; k++) { const a = k * 0.628 + th * 0.2; b.fillRect(q(cx + Math.cos(a) * r) - 0.5 / AS, q(cy + Math.sin(a) * r) - 0.5 / AS, 1 / AS, 1 / AS); }
}

/* =====================================================================
   FOOTWORK — player-controlled bodies (same physics for both players)
   ===================================================================== */
const newBody = (y) => ({ x: 0, y, vx: 0, vy: 0, run: 0, moving: false,
  stam: 100, cap: 100, stamAtStart: 100,      // stamina now / ceiling it can recover to / at point start
  air: 0, boost: 0, boostMul: 1,              // split-step: time left in the air, first-step boost after landing
  landT: -9, contactT: -9, contactId: 0, gradedFor: -1,
  slide: 0, slideV: { x: 0, y: 0 }, slideCD: 0, slideRec: 0 });   // slide: time left, its velocity, cooldown, recovery
const pos = [newBody(-12.4), newBody(12.4)];
window.pos = pos;            // captured-serve getPose reads the bodies while a serve is playing
let ball = null;          // {x,y,z}
let rally = null;
let swing = [0, 0];
let clock = 0;            // rally time in seconds

const ai = { target: null, at: 0 };

/* One physics step for a body. ix/iy is the wanted direction (-1..1) in court axes. */

    p.vx = p.slideV.x * k; p.vy = p.slideV.y * k;
    if (p.slide === 0) p.slideRec = SLIDE.recover;    // you have to plant and recover after a slide
  } else if (p.air > 0) {                             // airborne: no push-off, momentum carries you
    p.air -= dt;

    if (dl > 1e-4) {

      const dv = Math.min(dl, rate * dt);

/* Slide: a burst that carries you a set distance in the direction you're pushing (or already running).

const SLIDE = { dur: 0.32, recover: 0.25, cooldown: 0.8, stamina: 3,

function slide(i) {

  let [dx, dy] = i === 0 ? userInput() : [0, 0];
  if (!dx && !dy) { dx = p.vx; dy = p.vy; }           // no key held: slide the way you're running
  const m = Math.hypot(dx, dy); if (m < 0.1) return;

  const v0 = 2 * dist / SLIDE.dur;                    // linear slow-down: distance = v0 × dur / 2

/* Split-step: a small hop timed to land as the opponent strikes the ball. */
function splitStep(i) {
  const p = pos[i];

  p.air = SPLIT_AIR;
}
function gradeSplit(i) {

  if (Math.abs(d) > 0.3) return;                      // hop unrelated to this shot
  p.gradedFor = p.contactId;

  else if (a <= BODY[i].splitGood) { p.boost = 0.4; p.boostMul = 1.45; say(i, "GOOD SPLIT"); }
  else say(i, d < 0 ? "EARLY SPLIT" : "LATE SPLIT");

/* Opponent AI drives the same body: steer to a target, brake in time to stop on it. */
function aiInput() {
  const p = pos[1], t = ai.target;
  if (!t) return [0, 0];
  const dx = t.x - p.x, dy = t.y - p.y, d = Math.hypot(dx, dy);

/* MOVEMENT is always WASD: W = forward (toward the net), S = back, A = left, D = right (or drag on touch).

function userInput() {
  const k = input.keys;
  let x = (k.has("d") ? 1 : 0) - (k.has("a") ? 1 : 0);
  let y = (k.has("w") ? 1 : 0) - (k.has("s") ? 1 : 0);
  if (!x && !y) { x = input.stick.x; y = input.stick.y; }

  const k = input.keys;

let msgTimer;
function say(i, text) {
  if (i !== 0) return;                                // only the user's body talks to the HUD
  const el = document.getElementById("hudMsg");
  el.textContent = text;
  clearTimeout(msgTimer); msgTimer = setTimeout(() => (el.textContent = ""), 1100);
