<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tennis101 Versions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Silkscreen&display=swap">
<style>
:root { --night:#0a1120; --panel:#0e1729; --line:#2a3b5e; --ink:#eef3fb; --muted:#8b9cbc; --ball:#d8ee4c; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--night); color: var(--ink); font: 15px/1.5 "IBM Plex Mono", ui-monospace, Menlo, monospace; }
main { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 14px; }
h1 { margin: 0; font: 700 38px/1 "Barlow Condensed", sans-serif; }
h1 small { display: block; font: 9px Silkscreen, monospace; letter-spacing: .1em; color: var(--ball); margin-bottom: 8px; }
p { margin: 0; color: var(--muted); }
article { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 8px; }
article header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
article h2 { margin: 0; font: 700 26px "Barlow Condensed", sans-serif; }
.when { color: var(--muted); font-size: 13px; }
ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
a.play { justify-self: start; font: 600 16px "Barlow Condensed", sans-serif; letter-spacing: .05em; text-transform: uppercase; color: var(--night);
         background: var(--ball); border-radius: 5px; padding: 6px 12px; text-decoration: none; }
a.play:focus-visible { outline: 2px solid var(--ball); outline-offset: 2px; }
.none { color: var(--muted); font-size: 13px; }
</style>
<main>
  <div><h1><small>TENNIS101 · VERSION HISTORY</small>Every version, playable</h1>
  <p>A new version is published once 5 or more changes have built up (see CHANGELOG.md). Times are approximate, Eastern.</p></div>
  <div id="list"></div>
</main>
<script>
// Built from CHANGELOG.md, so this page never disagrees with it.
const PLAY = { "v0.5.0": "v0.5.0/index.html", "v0.4.0": "v0.4.0/index.html", "v0.3.0": "v0.3.0/index.html", "v0.2.1": "v0.2.1/index.html", "v0.1.0": "../backup/index-v1-scoreboard.html" };
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
fetch("../CHANGELOG.md").then(r => r.text()).then(md => {
  const out = [];
  for (const block of md.split(/^## /m).slice(1)) {
    const [head, ...lines] = block.trim().split("\n");
    const [v, when] = head.split(" — ");
    const notes = lines.filter(l => l.startsWith("- ")).map(l => `<li>${esc(l.slice(2))}</li>`).join("");
    out.push(`<article><header><h2>${esc(v)}</h2><span class="when">${esc(when || "")}</span></header><ul>${notes}</ul>
      ${PLAY[v] ? `<a class="play" href="${PLAY[v]}">Play ${esc(v)}</a>` : `<span class="none">No playable copy saved for this version.</span>`}</article>`);
  }
  document.getElementById("list").innerHTML = out.join("");
});
</script>
